  <script>
// Maths Unit 2: Introducing Ratios — lesson sections, their teaching steps, and practice generators.
// Practice questions use the same shape as js/questions.js. New format: 'number' (a typed number, checked by `check`).
const RatioUnit = (() => {
  const D = Diagrams;
  const { randInt, pick, shuffle, pickTwo } = Util;
  const { miniCheck, stepper } = Lessons;
  const r = (x, y) => `${x} : ${y}`;
  const strong = (s) => `<strong>${s}</strong>`;
  const money = (n) => `$${n.toFixed(2)}`;
  const BATCH = { 1: 'single batch', 2: 'double batch', 3: 'triple batch', 4: 'quadruple batch' };

  const SKILLS = {
    batchScale:   'Double or triple a recipe',
    batchDiagram: 'Show batches with a diagram',
    colorMix:     'Equivalent color mixtures',
    makeEquiv:    'Create an equivalent ratio',
    isEquiv:      'Decide if ratios are equivalent',
    dnlMissing:   'Complete a double number line',
    dnlExtend:    'Extend a double number line',
    unitPrice:    'Find the price for one',
    costOfN:      'Use the price for one',
    betterDeal:   'Compare prices',
    speed:        'Find a constant speed',
    distance:     'Use a constant speed',
    sameRate:     'Compare situations with ratios',
    tableMissing: 'Complete a table of equivalent ratios',
    tableUnit:    'Find how much for one in a table',
    wordEquiv:    'Solve an equivalent ratio problem',
    pppWhole:     'Find a part from the total',
    pppTotal:     'Find the total from a part',
    tapeRead:     'Read a tape diagram',
  };

  // [first quantity, second quantity, what it makes]
  const RECIPES = [
    ['cups of flour', 'eggs', 'pancakes'],
    ['cups of rice', 'cups of water', 'rice'],
    ['scoops of lemonade mix', 'cups of water', 'lemonade'],
    ['cups of oats', 'cups of milk', 'oatmeal'],
    ['cups of peanuts', 'cups of raisins', 'trail mix'],
    ['bananas', 'cups of yogurt', 'smoothies'],
  ];
  const PAINTS = [
    ['cups of blue paint', 'cups of yellow paint', 'green paint'],
    ['cups of red paint', 'cups of white paint', 'pink paint'],
    ['cups of red paint', 'cups of yellow paint', 'orange paint'],
    ['drops of blue dye', 'cups of water', 'light blue water'],
  ];
  // [plural item, possible prices for one]
  const SHOP = [
    ['pens', [0.5, 0.75, 1.25, 1.5]],
    ['notebooks', [1.5, 2, 2.5, 3]],
    ['tacos', [1.25, 1.5, 2, 2.5]],
    ['bottles of water', [0.75, 1, 1.25]],
    ['bags of popcorn', [2, 2.5, 3, 3.5]],
    ['granola bars', [0.5, 0.75, 1]],
  ];
  const MOVERS = [
    ['A runner', 'meters', 'seconds'],
    ['A bike', 'miles', 'hours'],
    ['A snail', 'centimeters', 'minutes'],
    ['A train', 'miles', 'hours'],
    ['A swimmer', 'meters', 'minutes'],
  ];
  // [first group, second group, whole, short tape labels]
  const GROUPS = [
    ['boys', 'girls', 'students in the club', 'boys', 'girls'],
    ['cats', 'dogs', 'pets at the shelter', 'cats', 'dogs'],
    ['red marbles', 'blue marbles', 'marbles in the bag', 'red', 'blue'],
    ['fiction books', 'nonfiction books', 'books on the shelf', 'fiction', 'nonfiction'],
    ['cups of juice', 'cups of sparkling water', 'cups of punch', 'juice', 'sparkling'],
  ];

  // ---------- Answer checking ----------
  // Accepts 12, 1.5, .5, $1.50, 3/2, and a trailing unit word ("15 cups").
  function parseNumber(str) {
    if (typeof str !== 'string') return null;
    const m = str.trim().toLowerCase().replace(/[$,]/g, '').match(/^(\d+(?:\.\d+)?|\.\d+|\d+\s*\/\s*\d+)\s*[a-z ]*$/);
    if (!m) return null;
    if (m[1].includes('/')) {
      const [p, q] = m[1].split('/').map((x) => parseInt(x, 10));
      return q ? p / q : null;
    }
    return parseFloat(m[1]);
  }

  const near = (a, b) => Math.abs(a - b) < 1e-6;

  // wrong: [[value, targeted hint]] for common mistakes.
  function numberChecker(answer, wrong = []) {
    return (input) => {
      const n = parseNumber(input);
      if (n == null) return { status: 'invalid', message: 'Type just a number, like <strong>12</strong> or <strong>1.5</strong>.' };
      if (near(n, answer)) return { status: 'correct' };
      const w = wrong.find(([v]) => near(v, n) && !near(v, answer));
      return { status: 'incorrect', message: w ? w[1] : undefined };
    };
  }

  // opts: [{ html, correct?, hint }]; duplicates are dropped, then shuffled and lettered.
  function mc(opts) {
    const seen = new Set();
    const unique = opts.filter((o) => !seen.has(o.html) && seen.add(o.html));
    const options = shuffle(unique).map((o, i) => ({ ...o, id: 'ABCD'[i] }));
    return {
      format: 'mc',
      options,
      check: (id) => {
        const opt = options.find((o) => o.id === id);
        if (!opt) return { status: 'invalid', message: 'Choose one of the answers.' };
        return opt.correct ? { status: 'correct' } : { status: 'incorrect', message: opt.hint };
      },
    };
  }

  const number = (answer, wrong) => ({ format: 'number', check: numberChecker(answer, wrong) });

  // Two different whole numbers in [min, max] with no common factor, so the ratio is in simplest form.
  function coprime(min, max) {
    for (;;) {
      const a = randInt(min, max);
      const b = randInt(min, max);
      if (a !== b && Util.gcd(a, b) === 1) return [a, b];
    }
  }

  // ---------- Practice generators ----------
  function batchScale() {
    const [A, B, thing] = pick(RECIPES);
    const [a, b] = coprime(1, 5);
    const n = randInt(2, 4);
    const askB = Math.random() < 0.5;
    const [have, want, hv, wv] = askB ? [A, B, a, b] : [B, A, b, a];
    return {
      type: 'batchScale', skill: SKILLS.batchScale,
      prompt: `A recipe for ${thing} uses ${strong(`${a} ${A}`)} for every ${strong(`${b} ${B}`)}. How many ${strong(want)} do you need for a ${strong(BATCH[n])}?`,
      summary: `${BATCH[n]} of ${thing}: ${r(a, b)}, find ${want}`,
      ...number(wv * n, [
        [wv + n, `It looks like you added ${n}. A ${BATCH[n]} means <em>${n} times</em> as much of everything.`],
        [hv * n, `That is the ${have}. The question asks for the ${want}.`],
        [wv, 'That is a single batch. Multiply to make the bigger batch.'],
      ]),
      hint: `A ${BATCH[n]} uses ${n} times as much of each ingredient. Multiply ${wv} by ${n}.`,
      explanation: `${wv} × ${n} = ${wv * n}. The ${BATCH[n]} uses ${r(a * n, b * n)}, which is equivalent to ${r(a, b)}.`,
      solution: `${wv * n} ${want}`,
    };
  }

  function batchDiagram() {
    const [ka, kb] = pickTwo(D.ITEM_KEYS);
    const [A, B, thing] = pick(RECIPES);
    const [a, b] = coprime(1, 3);
    const n = randInt(2, 3);
    const opt = (bA, bB, count, extra) => ({ html: D.batches({ a: bA, b: bB, itemA: ka, itemB: kb, n: count }), ...extra });
    return {
      type: 'batchDiagram', skill: SKILLS.batchDiagram,
      prompt: `A recipe for ${thing} uses ${a} ${A} for every ${b} ${B}. In each diagram, ${D.chip(ka)} = 1 of the ${A} and ${D.chip(kb)} = 1 of the ${B}. Which diagram shows a ${strong(BATCH[n])}?`,
      summary: `Diagram for a ${BATCH[n]} of ${r(a, b)} ${thing}`,
      ...mc([
        opt(a, b, n, { correct: true }),
        opt(a, b, n + 1, { hint: `Count the batches. A ${BATCH[n]} has exactly ${n}.` }),
        opt(b, a, n, { hint: `Look at each batch. It should have ${a} ${D.ITEMS[ka].name} and ${b} ${D.ITEMS[kb].name}, not the other way around.` }),
        opt(a, b + 1, n, { hint: `Each batch must match the recipe: exactly ${b} ${D.ITEMS[kb].name} per batch.` }),
      ]),
      wideOptions: true,
      hint: `Find the diagram with ${n} batches that each match the recipe: ${a} ${D.ITEMS[ka].name} and ${b} ${D.ITEMS[kb].name}.`,
      explanation: `A ${BATCH[n]} is ${n} copies of the recipe. That makes ${a * n} ${A} and ${b * n} ${B}: ${r(a * n, b * n)}.`,
      solution: `${n} batches of ${r(a, b)}`,
    };
  }

  function colorMix() {
    const [A, B, color] = pick(PAINTS);
    const [a, b] = coprime(1, 5);
    const k = randInt(2, 4);
    return {
      type: 'colorMix', skill: SKILLS.colorMix,
      prompt: `Lin mixes ${strong(`${a} ${A}`)} with ${strong(`${b} ${B}`)} to make ${color}. Which mixture makes the ${strong('same shade')}?`,
      summary: `Same shade as ${r(a, b)} ${color}, ×${k}`,
      ...mc([
        { html: `${a * k} ${A} and ${b * k} ${B}`, correct: true },
        { html: `${a + k} ${A} and ${b + k} ${B}`, hint: 'Adding the same amount to both changes the shade. To keep the same color, <em>multiply</em> both amounts by the same number.' },
        { html: `${b * k} ${A} and ${a * k} ${B}`, hint: 'Those amounts are switched, so the color would come out different.' },
        { html: `${a * k} ${A} and ${b} ${B}`, hint: `Only the ${A} were multiplied. Both amounts must be multiplied by the same number.` },
      ]),
      hint: 'A double or triple batch keeps the same color. Look for both amounts multiplied by the same number.',
      explanation: `${r(a, b)} × ${k} = ${r(a * k, b * k)}. Multiplying both amounts by ${k} makes ${k} batches of the same color, so the ratios are equivalent.`,
      solution: `${a * k} ${A} and ${b * k} ${B}`,
    };
  }

  function makeEquiv() {
    const [a, b] = coprime(1, 9);
    return {
      type: 'makeEquiv', skill: SKILLS.makeEquiv,
      prompt: `Write a ratio that is ${strong('equivalent')} to ${strong(r(a, b))}. (There are many right answers!)`,
      summary: `Equivalent to ${r(a, b)}`,
      format: 'ratio',
      check: (input) => {
        const p = Util.parseRatio(input);
        if (!p) return { status: 'invalid', message: 'Type your answer as two numbers, like <strong>6:4</strong>.' };
        const [x, y] = p;
        if (x === a && y === b) return { status: 'incorrect', message: 'That is the same ratio. Make a new one by multiplying both numbers by the same number.' };
        if (x > 0 && y > 0 && x * b === y * a) {
          return { status: 'correct', message: x % a === 0 ? `${r(a, b)} × ${x / a} = ${r(x, y)}.` : `${r(x, y)} works because both numbers are ${x / a} times as big.` };
        }
        if (x - a === y - b) return { status: 'incorrect', message: 'You added the same number to both. Equivalent ratios come from <em>multiplying</em> (or dividing) both numbers by the same number.' };
        if (x * a === y * b) return { status: 'incorrect', message: 'Check the order: the first number should match the first number of the ratio.' };
        return { status: 'incorrect' };
      },
      hint: `Multiply both ${a} and ${b} by the same number, like 2 or 3.`,
      explanation: `Multiply both numbers by the same number: ${r(a, b)} × 2 = ${r(a * 2, b * 2)}, ${r(a, b)} × 3 = ${r(a * 3, b * 3)}, and so on.`,
      solution: r(a * 2, b * 2),
    };
  }

  function isEquiv() {
    const [a, b] = coprime(1, 6);
    const k = randInt(2, 5);
    return {
      type: 'isEquiv', skill: SKILLS.isEquiv,
      prompt: `Which ratio is ${strong('equivalent')} to ${strong(r(a, b))}?`,
      summary: `Which is equivalent to ${r(a, b)} (×${k})`,
      ...mc([
        { html: r(a * k, b * k), correct: true },
        { html: r(a + k, b + k), hint: `${a} + ${k} and ${b} + ${k}: adding does not keep the ratio the same. Look for both numbers multiplied by the same number.` },
        { html: r(b * k, a * k), hint: 'The order is switched. The first number must go with the first quantity.' },
        { html: r(a * k, b * (k + 1)), hint: `${a} was multiplied by ${k}, but ${b} was multiplied by ${k + 1}. Both must use the same number.` },
      ]),
      hint: 'Ask: is there one number I can multiply both parts by?',
      explanation: `${a} × ${k} = ${a * k} and ${b} × ${k} = ${b * k}, so ${r(a * k, b * k)} is equivalent to ${r(a, b)}.`,
      solution: r(a * k, b * k),
    };
  }

  function dnlSpec(A, B, a, b, n, fmtB = String) {
    return {
      top: { label: A, values: Array.from({ length: n }, (_, i) => String(i * a)) },
      bottom: { label: B, values: Array.from({ length: n }, (_, i) => fmtB(i * b)) },
    };
  }

  function dnlMissing() {
    const [A, B] = pick([...RECIPES, ...PAINTS]);
    const [a, b] = coprime(1, 6);
    const n = 5;
    const i = randInt(2, n - 1);
    const onTop = Math.random() < 0.5;
    const spec = { ...dnlSpec(A, B, a, b, n), hidden: [`${onTop ? 't' : 'b'}${i}`] };
    const step = onTop ? a : b;
    const ans = i * step;
    return {
      type: 'dnlMissing', skill: SKILLS.dnlMissing,
      prompt: 'What number belongs in the box with the <strong>?</strong> on this double number line?',
      summary: `Double number line ${r(a, b)}, missing ${onTop ? 'top' : 'bottom'} #${i}`,
      visualHtml: D.doubleNumberLine(spec),
      ...number(ans, [
        [ans + 1, `Each tick mark adds ${step}, not 1.`],
        [i * (onTop ? b : a), 'That number belongs on the other line. Use the numbers on the same line as the box.'],
        [(i + 1) * step, 'Count the tick marks from 0 carefully.'],
      ]),
      hint: `On that line, each tick mark adds ${step}. Start at 0 and count up.`,
      explanation: `Each step on the ${onTop ? A : B} line adds ${step}. ${i} steps from 0 is ${i} × ${step} = ${ans}. That pairs with ${r(i * a, i * b)}.`,
      solution: String(ans),
    };
  }

  function dnlExtend() {
    const [A, B, thing] = pick(RECIPES);
    const [a, b] = coprime(1, 5);
    const n = 4;
    const m = randInt(5, 8);
    return {
      type: 'dnlExtend', skill: SKILLS.dnlExtend,
      prompt: `This double number line shows a recipe for ${thing}. If you keep going, how many ${strong(B)} go with ${strong(`${m * a} ${A}`)}?`,
      summary: `Extend ${r(a, b)} to ${m * a} ${A}`,
      visualHtml: D.doubleNumberLine(dnlSpec(A, B, a, b, n)),
      ...number(m * b, [
        [m * a, `That is the number of ${A}. The question asks for ${B}.`],
        [(n - 1) * b + (m * a - (n - 1) * a), `It looks like you added the same amount to both lines. Keep adding ${a} on top and ${b} on the bottom each step.`],
      ]),
      hint: `${m * a} is ${m} steps of ${a}. Take ${m} steps of ${b} on the bottom line.`,
      explanation: `${m * a} ÷ ${a} = ${m} steps. ${m} × ${b} = ${m * b} ${B}.`,
      solution: `${m * b}`,
    };
  }

  function unitPrice() {
    const [item, prices] = pick(SHOP);
    const unit = pick(prices);
    const n = randInt(2, 8);
    const total = unit * n;
    return {
      type: 'unitPrice', skill: SKILLS.unitPrice,
      prompt: `${n} ${item} cost ${strong(money(total))}. At this rate, how much does ${strong(`1`)} cost? (in dollars)`,
      summary: `${n} ${item} for ${money(total)}, price for one`,
      ...number(unit, [
        [total * n, `That multiplies. To find the price of 1, ${strong('divide')} the total by ${n}.`],
        [n / total, 'Divide the cost by the number of items, not the other way around.'],
        [total, `That is the price of all ${n}.`],
      ]),
      hint: `Split ${money(total)} into ${n} equal parts: ${money(total)} ÷ ${n}.`,
      explanation: `${money(total)} ÷ ${n} = ${money(unit)} for each one.`,
      solution: money(unit),
    };
  }

  function costOfN() {
    const [item, prices] = pick(SHOP);
    const unit = pick(prices);
    const n = randInt(2, 6);
    let m = randInt(2, 10);
    while (m === n) m = randInt(2, 10);
    const total = unit * n;
    return {
      type: 'costOfN', skill: SKILLS.costOfN,
      prompt: `${n} ${item} cost ${strong(money(total))}. At this rate, how much do ${strong(`${m} ${item}`)} cost? (in dollars)`,
      summary: `${n} ${item} for ${money(total)}, cost of ${m}`,
      ...number(unit * m, [
        [total + (m - n), 'It looks like you added $1 for each extra item. First find the price of one.'],
        [unit, `That is the price of 1. Now multiply by ${m}.`],
      ]),
      hint: `First find the price of 1: ${money(total)} ÷ ${n}. Then multiply by ${m}.`,
      explanation: `${money(total)} ÷ ${n} = ${money(unit)} each. ${money(unit)} × ${m} = ${money(unit * m)}.`,
      solution: money(unit * m),
    };
  }

  function betterDeal() {
    const [item, prices] = pick(SHOP);
    const [u1, u2] = pickTwo([...prices, prices[prices.length - 1] + 0.25]);
    const n1 = randInt(2, 6);
    let n2 = randInt(2, 8);
    while (n2 === n1) n2 = randInt(2, 8);
    const cheaper = u1 < u2 ? 'Store A' : 'Store B';
    return {
      type: 'betterDeal', skill: SKILLS.betterDeal,
      prompt: `Store A sells ${n1} ${item} for ${strong(money(u1 * n1))}. Store B sells ${n2} ${item} for ${strong(money(u2 * n2))}. Which store has the better deal (lower price for one)?`,
      summary: `Better deal: ${n1} for ${money(u1 * n1)} vs ${n2} for ${money(u2 * n2)}`,
      ...mc([
        { html: cheaper, correct: true },
        { html: cheaper === 'Store A' ? 'Store B' : 'Store A', hint: 'Find the price of 1 at each store, then compare.' },
        { html: 'They cost the same', hint: `Find the price for one at each store: they are not equal.` },
      ]),
      hint: `Store A: ${money(u1 * n1)} ÷ ${n1}. Store B: ${money(u2 * n2)} ÷ ${n2}. Which is less?`,
      explanation: `Store A: ${money(u1)} each. Store B: ${money(u2)} each. ${cheaper} is cheaper for one.`,
      solution: cheaper,
    };
  }

  function speed() {
    const [who, dist, time] = pick(MOVERS);
    const s = randInt(2, 12);
    const t = pick([2, 3, 4, 5, 6, 8, 10]);
    const d = s * t;
    const per = time.slice(0, -1);
    return {
      type: 'speed', skill: SKILLS.speed,
      prompt: `${who} goes ${strong(`${d} ${dist}`)} in ${strong(`${t} ${time}`)} at a constant speed. How many ${dist} does it go in ${strong(`1 ${per}`)}?`,
      summary: `${d} ${dist} in ${t} ${time}, speed`,
      ...number(s, [
        [d * t, `That multiplies. Divide the distance by the time: ${d} ÷ ${t}.`],
        [d - t, 'Subtracting does not give the speed. Divide the distance by the time.'],
      ]),
      hint: `Split ${d} ${dist} into ${t} equal parts, one for each ${per}.`,
      explanation: `${d} ÷ ${t} = ${s}, so the speed is ${s} ${dist} per ${per}.`,
      solution: `${s} ${dist} per ${per}`,
    };
  }

  function distance() {
    const [who, dist, time] = pick(MOVERS);
    const s = randInt(2, 9);
    const t = randInt(2, 5);
    let t2 = randInt(2, 10);
    while (t2 === t) t2 = randInt(2, 10);
    return {
      type: 'distance', skill: SKILLS.distance,
      prompt: `${who} goes ${strong(`${s * t} ${dist}`)} in ${strong(`${t} ${time}`)}. At the same speed, how far does it go in ${strong(`${t2} ${time}`)}?`,
      summary: `${s * t} ${dist} in ${t} ${time}, distance in ${t2}`,
      ...number(s * t2, [
        [s * t + (t2 - t), `Each extra ${time.slice(0, -1)} adds ${s} ${dist}, not 1.`],
        [s, `That is the distance in 1 ${time.slice(0, -1)}. Multiply by ${t2}.`],
      ]),
      hint: `First find the distance in 1 ${time.slice(0, -1)}: ${s * t} ÷ ${t}. Then multiply by ${t2}.`,
      explanation: `Speed: ${s * t} ÷ ${t} = ${s} ${dist} per ${time.slice(0, -1)}. In ${t2} ${time}: ${s} × ${t2} = ${s * t2} ${dist}.`,
      solution: `${s * t2} ${dist}`,
    };
  }

  function sameRate() {
    const [a, b] = coprime(1, 5);
    const k = randInt(2, 4);
    const kind = pick(['same', 'added', 'more']);
    const [c, d] = kind === 'same' ? [a * k, b * k] : kind === 'added' ? [a + k, b + k] : [a * k + 1, b * k];
    // Strength = scoops per cup of water; compare a/b with c/d.
    const diff = a * d - c * b;
    const answer = diff === 0 ? 'They taste the same' : diff > 0 ? 'Jada\'s is stronger' : 'Noah\'s is stronger';
    return {
      type: 'sameRate', skill: SKILLS.sameRate,
      prompt: `Jada mixes ${strong(`${a} scoops`)} of lemonade mix with ${strong(`${b} cups`)} of water. Noah mixes ${strong(`${c} scoops`)} with ${strong(`${d} cups`)} of water. How do they compare?`,
      summary: `Lemonade ${r(a, b)} vs ${r(c, d)}`,
      ...mc([
        { html: answer, correct: true },
        ...['They taste the same', 'Jada\'s is stronger', 'Noah\'s is stronger'].filter((x) => x !== answer).map((html) => ({
          html,
          hint: kind === 'added'
            ? 'Adding the same number to both amounts does not keep the same taste. Compare scoops per cup of water.'
            : `Check: multiply Jada's ${r(a, b)} by ${k}. Does it match Noah's ${r(c, d)}?`,
        })),
      ]),
      hint: `Scale Jada's recipe to use ${d} cups of water (or compare scoops for each cup of water).`,
      explanation: diff === 0
        ? `${r(a, b)} × ${k} = ${r(c, d)}. The ratios are equivalent, so they taste the same.`
        : `Jada: ${a} scoops for ${b} cups = ${(a / b).toFixed(2)} scoop per cup. Noah: ${c} for ${d} = ${(c / d).toFixed(2)} scoop per cup. More mix per cup tastes stronger.`,
      solution: answer,
    };
  }

  function tableMissing() {
    const [A, B] = pick([...RECIPES, ...PAINTS]);
    const [a, b] = coprime(1, 6);
    const ks = shuffle([1, 2, 3, 4, 5, 6, 10]).slice(0, 4).sort((x, y) => x - y);
    const ri = randInt(1, 3);
    const ci = randInt(0, 1);
    const rows = ks.map((k) => [k * a, k * b]);
    const ans = rows[ri][ci];
    return {
      type: 'tableMissing', skill: SKILLS.tableMissing,
      prompt: 'This table shows equivalent ratios. What number replaces the <strong>?</strong>',
      summary: `Table ${r(a, b)}, rows ×${ks.join(',')}, missing ${ri},${ci}`,
      visualHtml: D.ratioTable({ heads: [A, B], rows, hidden: [`${ri},${ci}`] }),
      ...number(ans, [
        [rows[ri][1 - ci], 'That number belongs in the other column.'],
        [rows[ri][1 - ci] + (ci === 0 ? a - b : b - a), 'Adding does not work in a ratio table. Multiply instead.'],
      ]),
      hint: `Every row is ${r(a, b)} with both numbers multiplied by the same number. Use the number you know in row ${ri + 1} to find that multiplier.`,
      explanation: `${r(a, b)} × ${ks[ri]} = ${r(ks[ri] * a, ks[ri] * b)}, so the missing number is ${ans}.`,
      solution: String(ans),
    };
  }

  function tableUnit() {
    const [item, prices] = pick(SHOP);
    const unit = pick(prices.filter((p) => p >= 1));
    const ns = shuffle([2, 3, 4, 5, 6, 8]).slice(0, 3).sort((x, y) => x - y);
    const rows = ns.map((n) => [n, money(n * unit)]);
    return {
      type: 'tableUnit', skill: SKILLS.tableUnit,
      prompt: `This table shows the cost of ${item}. How much does ${strong(`1`)} cost? (in dollars)`,
      summary: `Table of ${item} at ${money(unit)}`,
      visualHtml: D.ratioTable({ heads: [`number of ${item}`, 'cost (dollars)'], rows: [[1, '<span class="blank">?</span>'], ...rows] }),
      ...number(unit, [
        [ns[0] * unit, `That is the cost of ${ns[0]}. Divide by ${ns[0]} to find the cost of 1.`],
        [unit * ns[0] - unit, 'Subtracting a row does not give the price of one. Divide the cost by the number of items.'],
      ]),
      hint: `Pick any row and divide: ${money(ns[0] * unit)} ÷ ${ns[0]}.`,
      explanation: `${money(ns[0] * unit)} ÷ ${ns[0]} = ${money(unit)}. Every row gives the same price for one: that's what makes the ratios equivalent.`,
      solution: money(unit),
    };
  }

  function wordEquiv() {
    const [A, B, thing] = pick(RECIPES);
    let a; let b; let c;
    if (Math.random() < 0.5) {
      [a, b] = coprime(2, 5);
      c = a * randInt(2, 6);
    } else {
      a = randInt(2, 4);
      b = a * randInt(2, 4);
      c = randInt(2, 11);
      if (c === a) c += 1;
    }
    const ans = (b / a) * c;
    return {
      type: 'wordEquiv', skill: SKILLS.wordEquiv,
      prompt: `A recipe for ${thing} uses ${strong(`${a} ${A}`)} for every ${strong(`${b} ${B}`)}. How many ${strong(B)} go with ${strong(`${c} ${A}`)}?`,
      summary: `${r(a, b)} ${thing}, ${c} ${A}`,
      ...number(ans, [
        [b + (c - a), 'Adding the same amount to both does not keep an equivalent ratio. Multiply instead.'],
        [(a / b) * c, 'The numbers are flipped. Check which amount goes with which.'],
      ]),
      hint: c % a === 0
        ? `${c} is ${c / a} times ${a}. Multiply ${b} by the same number.`
        : `Find how many ${B} for 1 of the ${A}: ${b} ÷ ${a}. Then multiply by ${c}.`,
      explanation: c % a === 0
        ? `${c} ÷ ${a} = ${c / a}, and ${b} × ${c / a} = ${ans}. So ${r(a, b)} is equivalent to ${r(c, ans)}.`
        : `${b} ÷ ${a} = ${b / a} ${B} for each one. ${b / a} × ${c} = ${ans}.`,
      solution: `${ans} ${B}`,
    };
  }

  function partWhole(askTotal) {
    const [A, B, whole, sA, sB] = pick(GROUPS);
    const [a, b] = coprime(1, 5);
    const k = randInt(2, 8);
    const total = k * (a + b);
    const tape = (text, totalLabel) => D.tapeParts({
      rows: [{ label: sA, n: a, item: 'blue', text }, { label: sB, n: b, item: 'orange', text }],
      total: totalLabel,
    });
    if (askTotal) {
      return {
        type: 'pppTotal', skill: SKILLS.pppTotal,
        prompt: `The ratio of ${A} to ${B} is ${strong(r(a, b))}. There are ${strong(`${k * a} ${A}`)}. How many ${strong(whole)} are there in all?`,
        summary: `${r(a, b)} ${A}:${B}, ${k * a} ${A}, total`,
        ...number(total, [
          [k * b, `That is the number of ${B}. Add the ${A} too to get the total.`],
          [k * a + b, `Each box is worth ${k}, so there are ${b} × ${k} ${B}, not ${b}.`],
        ]),
        hint: `Draw a tape diagram: ${a} boxes for ${A}, ${b} for ${B}. ${k * a} ÷ ${a} tells you what each box is worth.`,
        explanation: `Each box is ${k * a} ÷ ${a} = ${k}. There are ${a + b} boxes, so ${a + b} × ${k} = ${total} in all.${tape(k, `${total} in all`)}`,
        solution: String(total),
      };
    }
    return {
      type: 'pppWhole', skill: SKILLS.pppWhole,
      prompt: `There are ${strong(`${total} ${whole}`)}. The ratio of ${A} to ${B} is ${strong(r(a, b))}. How many ${strong(B)} are there?`,
      summary: `${total} ${whole}, ${r(a, b)}, find ${B}`,
      ...number(k * b, [
        [k * a, `That is the number of ${A}. The question asks for ${B}.`],
        [k, `That is the value of one box. There are ${b} boxes for ${B}.`],
      ]),
      hint: `Make a tape diagram with ${a} + ${b} = ${a + b} equal boxes. Each box is ${total} ÷ ${a + b}.`,
      explanation: `${total} ÷ ${a + b} boxes = ${k} in each box. ${B}: ${b} × ${k} = ${k * b}.${tape(k, `${total} in all`)}`,
      solution: String(k * b),
    };
  }
  const pppWhole = () => partWhole(false);
  const pppTotal = () => partWhole(true);

  function tapeRead() {
    const [A, B, whole, sA, sB] = pick(GROUPS);
    const [a, b] = coprime(1, 5);
    const k = randInt(2, 9);
    const total = k * (a + b);
    return {
      type: 'tapeRead', skill: SKILLS.tapeRead,
      prompt: `The tape diagram shows ${A} and ${B} in a ratio of ${r(a, b)}. There are ${strong(`${total} ${whole}`)}. How much is ${strong('one box')} worth?`,
      summary: `Tape ${r(a, b)}, total ${total}`,
      visualHtml: D.tapeParts({
        rows: [{ label: sA, n: a, item: 'blue', text: '?' }, { label: sB, n: b, item: 'orange', text: '?' }],
        total: `${total} in all`,
      }),
      ...number(k, [
        [total / a, `Divide by all ${a + b} boxes, not just the ${a} for ${A}.`],
        [total / b, `Divide by all ${a + b} boxes, not just the ${b} for ${B}.`],
      ]),
      hint: `Count all the boxes: ${a} + ${b} = ${a + b}. Share ${total} equally among them.`,
      explanation: `${total} ÷ ${a + b} = ${k}. Each box is worth ${k}.`,
      solution: String(k),
    };
  }

  const GENERATORS = {
    batchScale, batchDiagram, colorMix, makeEquiv, isEquiv, dnlMissing, dnlExtend,
    unitPrice, costOfN, betterDeal, speed, distance, sameRate, tableMissing, tableUnit,
    wordEquiv, pppWhole, pppTotal, tapeRead,
  };
  // Practice can also mix in the ratio basics from js/questions.js.
  const ALL = { ...Questions.GENERATORS, ...GENERATORS };

  // Picks `count` different questions, rotating through the types so each one shows up.
  function buildSession(types, count) {
    const seen = new Set();
    const picked = [];
    for (let tries = 0; picked.length < count && tries < 60; tries++) {
      for (const type of shuffle(types)) {
        if (picked.length >= count) break;
        const q = ALL[type](0);
        if (seen.has(q.summary)) continue;
        seen.add(q.summary);
        picked.push(q);
      }
    }
    return shuffle(picked);
  }

  // Mixes blue (hue 220) toward yellow (hue 55) through green; equivalent ratios give the same hue.
  function swatch(blue, yellow) {
    if (!blue && !yellow) return '<span class="swatch swatch-empty">empty</span>';
    const t = yellow / (blue + yellow);
    const hue = Math.round(235 - 190 * t * t);
    return `<span class="swatch" style="background:hsl(${hue} 75% ${30 + 34 * t}%)" aria-label="paint color"></span>`;
  }

const SouthAsiaMap = (() => {

  const E_LON = 98;

  const RIVERS = {

  const RANGES = {
    himalayas: { name: 'Himalayas', peaks: [[73, 35.6], [75, 34.9], [77, 33.4], [78.8, 31.6], [80.6, 30.3], [82.5, 29.4], [84.4, 28.6], [86.2, 28.2], [88, 28], [89.8, 28], [91.6, 28.1], [93.4, 28.3]], label: [84.2, 31.4] },

    westernGhats: { name: 'Western Ghats', peaks: [[73.9, 19.5], [73.9, 18], [74.1, 16.5], [74.6, 15], [75.2, 13.4], [75.8, 11.9], [76.6, 10.4], [77.2, 9.2]], label: [69.4, 14.4] },
    easternGhats: { name: 'Eastern Ghats', peaks: [[79.2, 13.4], [79.5, 14.8], [80.4, 16.4], [81.8, 17.6], [83.2, 18.7], [84.4, 19.9]], label: [84.6, 13.8] },
  };
  const AREAS = {
    arabianSea: { name: 'Arabian Sea', at: [65.5, 16], cls: 'water' },
    bayOfBengal: { name: 'Bay of Bengal', at: [88.6, 16], cls: 'water' },
    indianOcean: { name: 'Indian Ocean', at: [87.5, 7.2], cls: 'water' },

    thar: { name: 'Thar Desert', at: [71.4, 27.1], cls: 'land' },
    sriLanka: { name: 'Sri Lanka', at: [83.9, 6.2], cls: 'land' },
  };

  // Places used for measuring and for practice questions.
  const PLACES = {
    indusMouth: { name: 'mouth of the Indus River', short: 'Indus mouth', at: [67.4, 23.95] },
    gangesMouth: { name: 'mouth of the Ganges River', short: 'Ganges mouth', at: [90.6, 22.3] },
    everest: { name: 'Mount Everest', short: 'Mt. Everest', at: [86.93, 27.99] },

    lahore: { name: 'Lahore', at: [74.35, 31.55] },

    mumbai: { name: 'Mumbai', at: [72.88, 19.08] },

    bengaluru: { name: 'Bengaluru', at: [77.59, 12.97] },
    hyderabad: { name: 'Hyderabad', at: [78.47, 17.39] },
    kathmandu: { name: 'Kathmandu', at: [85.32, 27.72] },
    dhaka: { name: 'Dhaka', at: [90.41, 23.81] },
    colombo: { name: 'Colombo', at: [79.86, 6.93] },
    kanyakumari: { name: 'Kanyakumari (southern tip of India)', short: 'Kanyakumari', at: [77.55, 8.08] },
  };

  // Ready-made measurements for the lesson.
  const PRESETS = [
    { key: 'rivers', label: 'Indus mouth → Ganges mouth', a: PLACES.indusMouth.at, b: PLACES.gangesMouth.at },
    { key: 'w20', label: 'Width of India at 20°N', a: [72.7, 20], b: [86.25, 20] },
    { key: 'w10', label: 'Width of India at 10°N', a: [76.22, 10], b: [79.85, 10] },
    { key: 'slW', label: 'Sri Lanka, east to west', a: [79.8, 7.8], b: [81.85, 7.8] },
    { key: 'slL', label: 'Sri Lanka, north to south', a: [80.05, 9.8], b: [80.05, 5.95] },
    { key: 'delhiKolkata', label: 'Delhi → Kolkata', a: PLACES.delhi.at, b: PLACES.kolkata.at },
  ];

  const roundTo = (n, step) => Math.round(n / step) * step;

  // ---------- Drawing ----------
  const [scaleX, scaleY] = [18, HEIGHT - 22];
  const SCALE_LEN = SCALE_MILES / MILES_PER_UNIT;

  function scaleBar() {
    const x2 = scaleX + SCALE_LEN;
    return `
      <g class="map-scale">
        <rect x="${scaleX - 8}" y="${scaleY - 26}" width="${SCALE_LEN + 52}" height="42" rx="6" class="map-panel"/>
        <line x1="${scaleX}" y1="${scaleY}" x2="${x2}" y2="${scaleY}"/>
        <line x1="${scaleX}" y1="${scaleY - 6}" x2="${scaleX}" y2="${scaleY + 6}"/>
        <line x1="${scaleX + SCALE_LEN / 2}" y1="${scaleY - 4}" x2="${scaleX + SCALE_LEN / 2}" y2="${scaleY + 4}"/>
        <line x1="${x2}" y1="${scaleY - 6}" x2="${x2}" y2="${scaleY + 6}"/>
        <text x="${scaleX}" y="${scaleY - 10}" text-anchor="middle">0</text>
        <text x="${x2}" y="${scaleY - 10}" text-anchor="middle">200 miles</text>
      </g>`;
  }

  function compass() {
    const [cx, cy] = [WIDTH - 34, HEIGHT - 44];
    return `
      <g class="map-compass" transform="translate(${cx} ${cy})">
        <circle r="24" class="map-panel"/>
        <polygon points="0,-18 5,0 0,18 -5,0" class="needle"/>
        <polygon points="-18,0 0,4 18,0 0,-4" class="needle-ew"/>
        <text y="-25" text-anchor="middle">N</text>
      </g>`;
  }

  function grid() {
    let g = '<g class="map-grid">';
    for (let lat = 10; lat <= 35; lat += 5) {
      const [, y] = project(W_LON, lat);
      g += `<line x1="0" y1="${y}" x2="${WIDTH}" y2="${y}"/><text x="${WIDTH - 4}" y="${y - 4}" text-anchor="end">${lat}°N</text>`;
    }
    for (let lon = 65; lon <= 95; lon += 5) {
      const [x] = project(lon, N_LAT);
      g += `<line x1="${x}" y1="0" x2="${x}" y2="${HEIGHT}"/><text x="${x + 3}" y="12">${lon}°E</text>`;
    }
    return `${g}</g>`;
  }

  // Mountain range as a row of little peaks.
  const peaks = (list) => list.map(([lon, lat]) => {
    const [x, y] = project(lon, lat);
    return `<path d="M${(x - 7).toFixed(1)} ${(y + 4).toFixed(1)} L${x.toFixed(1)} ${(y - 6).toFixed(1)} L${(x + 7).toFixed(1)} ${(y + 4).toFixed(1)}"/>`;
  }).join('');

  const textAt = ([lon, lat], text, cls = '') => {
    const [x, y] = project(lon, lat);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${cls}" text-anchor="middle">${text}</text>`;
  };

  // opts: { labels: true | false, markers: [{ at, label, kind }], line: [a, b], grid: true, id }
  // With labels false, every feature label is still drawn but hidden until the container shows it (data-key).
  function render({ labels = true, markers = [], line = null, gridLines = true, aria = 'Map of South Asia' } = {}) {
    const lbl = (key, inner) => `<g class="map-label ${labels ? 'is-on' : ''}" data-key="${key}">${inner}</g>`;
    let body = `<rect width="${WIDTH}" height="${HEIGHT}" class="map-ocean"/>`;
    body += `<polygon points="${pts(LAND)}" class="map-land"/><polygon points="${pts(SRI_LANKA)}" class="map-land"/>`;
    if (gridLines) body += grid();
    Object.entries(RANGES).forEach(([key, r]) => {
      body += `<g class="map-range" data-key="${key}">${peaks(r.peaks)}</g>`;
      body += lbl(key, textAt(r.label, r.name, 'map-text'));
    });
    Object.entries(RIVERS).forEach(([key, r]) => {
      body += `<polyline points="${pts(r.path)}" class="map-river" data-key="${key}"/>`;
      body += lbl(key, textAt(r.label, r.name, 'map-text river-text'));
    });
    Object.entries(AREAS).forEach(([key, a]) => { body += lbl(key, textAt(a.at, a.name, `map-text ${a.cls}-text`)); });
    const [ex, ey] = project(...PLACES.everest.at);
    body += `<polygon points="${ex},${ey - 8} ${ex + 6},${ey + 3} ${ex - 6},${ey + 3}" class="map-everest"/>`;
    body += lbl('everest', `<text x="${ex + 8}" y="${ey + 14}" class="map-text">Mt. Everest</text>`);
    if (line) {
      const [x1, y1] = project(...line[0]);
      const [x2, y2] = project(...line[1]);
      body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="map-measure"/>`;
    }
    markers.forEach((m) => {
      const [x, y] = project(...m.at);
      if (m.kind === 'letter') {
        body += `<circle cx="${x}" cy="${y}" r="11" class="map-letter"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" class="map-letter-text">${m.label}</text>`;
      } else {
        const right = x < WIDTH - 110;
        body += `<circle cx="${x}" cy="${y}" r="5" class="map-dot"/><text x="${x + (right ? 9 : -9)}" y="${y - 7}" text-anchor="${right ? 'start' : 'end'}" class="map-place">${m.label}</text>`;
      }
    });
    body += scaleBar() + compass();
    body += '<g class="map-ruler"></g>';
    return `<svg class="sa-map" viewBox="0 0 ${WIDTH.toFixed(0)} ${HEIGHT}" role="img" aria-label="${aria}">${body}</svg>`;
  }

  // Interactive ruler: tap two points; reports { miles, bars }. Presets draw a known measurement.
  function attachRuler(svg, onMeasure) {
    const layer = svg.querySelector('.map-ruler');
    let start = null;
    const toMap = (e) => {
      const p = svg.createSVGPoint();
      p.x = e.clientX;
      p.y = e.clientY;
      const q = p.matrixTransform(svg.getScreenCTM().inverse());
      return unproject(q.x, q.y);
    };
    function draw(a, b) {
      const [x1, y1] = project(...a);
      const pt = (x, y) => `<circle cx="${x}" cy="${y}" r="5" class="ruler-dot"/>`;
      if (!b) {
        layer.innerHTML = pt(x1, y1);
        return;
      }
      const [x2, y2] = project(...b);
      const m = miles(a, b);
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const text = `≈ ${roundTo(m, 10)} mi`;
      layer.innerHTML = `
        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ruler-line"/>${pt(x1, y1)}${pt(x2, y2)}
        <rect x="${mx - 38}" y="${my - 24}" width="76" height="20" rx="10" class="ruler-tag"/>
        <text x="${mx}" y="${my - 10}" text-anchor="middle" class="ruler-text">${text}</text>`;
      onMeasure({ miles: m, bars: m / SCALE_MILES, a, b });
    }
    svg.addEventListener('click', (e) => {
      const at = toMap(e);
      if (!start) {
        start = at;
        draw(start);
        onMeasure(null);
      } else {
        draw(start, at);
        start = null;
      }
    });
    return { show: (a, b) => { start = null; draw(a, b); } };
  }

  // Compass direction (N, NE, …) from a to b, plus how far (in degrees) the bearing is from that direction's center.
  const DIRS = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];
  function direction(a, b) {
    const dx = (b[0] - a[0]) * SQUEEZE;
    const dy = b[1] - a[1];
    const bearing = ((Math.atan2(dx, dy) * 180) / Math.PI + 360) % 360;
    const i = Math.round(bearing / 45) % 8;
    return { dir: DIRS[i], index: i, off: Math.abs(((bearing - i * 45 + 540) % 360) - 180) };
  }

  return {
    render, attachRuler, miles, direction, project, unproject, roundTo,
    PLACES, PRESETS, RIVERS, RANGES, AREAS, DIRS, SCALE_MILES, SCALE_LEN, MILES_PER_UNIT,
    bounds: { W_LON, E_LON, N_LAT, S_LAT },
  };
})();

  const toQuestion = (skill, prompt, options, explanation, hint) => {
    const opts = shuffle(options.map(([html, h], i) => ({ html, correct: i === 0, hint: h })))
      .map((o, i) => ({ ...o, id: 'ABCD'[i] }));
    return {
      type: skill, skill: SKILLS[skill],
      prompt, summary: prompt.replace(/<[^>]+>/g, ''),
      format: 'mc', options: opts, textOptions: true,
      check: (id) => {
        const opt = opts.find((o) => o.id === id);
        if (!opt) return { status: 'invalid', message: 'Choose one of the answers.' };
        return opt.correct ? { status: 'correct' } : { status: 'incorrect', message: opt.hint };
      },
      hint: hint || 'Think back to the lesson. Which civilization, river, or idea does this describe?',
      explanation, solution: options[0][0],
    };
  };

  // ---------- Generated questions ----------
  // "Which river…?" and "Which civilization…?" built from the data, one factory per civilization.
  const riverFactories = CIVS.map((c) => () => toQuestion('compare',
    `${c.name} developed along which river (or rivers)?`,
    [[c.river], ...shuffle(CIVS.filter((o) => o !== c)).map((o) => [o.river, `The ${o.river} ${o.key === 'meso' ? 'are' : 'is'} where ${o.name} grew.`])],
    `${c.name} grew along the ${c.river}, in what is now ${c.today}.`,
    'Match each civilization to its river: Tigris & Euphrates, Nile, Indus, Yellow.'));

  const clueFactories = CIVS.map((c) => c.clues.map((clue) => () => toQuestion(c.key,
    `Which civilization ${clue}?`,
    [[c.name], ...CIVS.filter((o) => o !== c).map((o) => [o.name, `${o.name} is known for ${o.achievement}.`])],
    `${c.name} ${clue}. It is known for ${c.achievement}.`)));

  // Map questions drawn on the South Asia map.
  const M = SouthAsiaMap;
  const PLACE_KEYS = Object.keys(M.PLACES);
  const placeName = (p) => p.short || p.name;

  function mapDistance() {
    let a; let b; let d;
    do {
      [a, b] = Util.pickTwo(PLACE_KEYS).map((k) => M.PLACES[k]);
      d = M.miles(a.at, b.at);
    } while (d < 300 || d > 1700);
    const ans = M.roundTo(d, 50);
    const bars = d / M.SCALE_MILES;
    const q = toQuestion('distance',
      `Use the map scale. About how far is it from <strong>${placeName(a)}</strong> to <strong>${placeName(b)}</strong>?`,
      [
        [`About ${ans.toLocaleString()} miles`],
        [`About ${M.roundTo(d * 0.5, 50).toLocaleString()} miles`, 'Too short. Count how many scale bars fit along the dashed line, then multiply by 200.'],
        [`About ${M.roundTo(d * 1.6, 50).toLocaleString()} miles`, 'Too long. Lay the scale bar along the line again and count carefully.'],
        [`About ${Math.max(1, Math.round(bars))} miles`, 'That is how many scale bars long the line is. Each bar stands for 200 miles, so multiply by 200.'],
      ],
      `The line is about ${bars.toFixed(1)} scale bars long. ${bars.toFixed(1)} × 200 ≈ ${ans.toLocaleString()} miles.`,
      'Mark the line\'s length (a paper strip works), count how many 200-mile scale bars fit, then multiply by 200.');
    q.visualHtml = M.render({ labels: false, line: [a.at, b.at], markers: [{ at: a.at, label: placeName(a) }, { at: b.at, label: placeName(b) }] });
    q.summary = `Distance ${placeName(a)} to ${placeName(b)}`;
    return q;
  }

  function mapLatLon() {
    const lat = pick([10, 15, 20, 25, 30, 35]);
    const lon = pick([65, 70, 75, 80, 85, 90, 95]);
    const letter = pick(['A', 'B', 'C', 'D']);
    const loc = (la, lo) => `(${la}°N, ${lo}°E)`;
    const lat2 = lat + 5 <= 35 ? lat + 5 : lat - 5;
    const lon2 = lon + 5 <= 95 ? lon + 5 : lon - 5;
    const q = toQuestion('latlong',
      `What is the latitude and longitude of point <strong>${letter}</strong>?`,
      [
        [loc(lat, lon)],
        [`(${lon}°N, ${lat}°E)`, 'Latitude and longitude are switched. Write latitude (°N) first, then longitude (°E).'],
        [loc(lat2, lon), `Check the latitude: find the °N line that runs east–west through point ${letter}.`],
        [loc(lat, lon2), `Check the longitude: find the °E line that runs north–south through point ${letter}.`],
      ],
      `Point ${letter} sits where the ${lat}°N latitude line crosses the ${lon}°E longitude line: ${loc(lat, lon)}.`,
      'Follow the horizontal line to the right edge for latitude (°N). Follow the vertical line to the top for longitude (°E).');
    q.visualHtml = M.render({ labels: false, markers: [{ at: [lon, lat], label: letter, kind: 'letter' }] });
    q.summary = `Lat/long of ${loc(lat, lon)}`;
    return q;
  }

  function mapDirection() {
    let a; let b; let dir;
    do {
      [a, b] = Util.pickTwo(PLACE_KEYS).map((k) => M.PLACES[k]);
      dir = M.direction(a.at, b.at);
    } while (dir.off > 15 || M.miles(a.at, b.at) < 250);
    const D = M.DIRS;
    const i = dir.index;
    const cap = (t) => t[0].toUpperCase() + t.slice(1);
    const q = toQuestion('direction',
      `Look at the map. <strong>${cap(placeName(b))}</strong> is ________ of <strong>${placeName(a)}</strong>.`,
      [
        [D[i]],
        [D[(i + 4) % 8], `That is backwards. Start at ${placeName(a)} and look toward ${placeName(b)}.`],
        [D[(i + 2) % 8], 'Use the compass rose: north is toward the top of the map.'],
        [D[(i + 6) % 8], 'Use the compass rose: north is toward the top of the map.'],
      ],
      `Starting at ${placeName(a)}, you travel ${D[i]} to reach ${placeName(b)}.`,
      'Put your finger on the starting place, then see which way you move to reach the other place. Top = north, right = east.');
    q.visualHtml = M.render({ labels: false, markers: [{ at: a.at, label: placeName(a) }, { at: b.at, label: placeName(b) }] });
    q.summary = `Direction from ${placeName(a)} to ${placeName(b)}`;
    return q;
  }

  // Picks `count` different questions from the given skills, rotating so each skill shows up.
  function buildSession(skills, count) {
    const seen = new Set();
    const picked = [];
    for (let tries = 0; picked.length < count && tries < 60; tries++) {
      for (const skill of shuffle(skills)) {
        if (picked.length >= count) break;
        const q = pick(FACTORIES[skill])();
        if (seen.has(q.summary)) continue;
        seen.add(q.summary);
        picked.push(q);
      }
    }
    return shuffle(picked);
  }

  <script>
// Flashcard study sessions: flip a card, sort it into "Got it" or "Still learning", and remember mastered cards.
// Mastery is kept in localStorage on this device; falls back to memory if storage is blocked.
const Flashcards = (() => {
  const KEY = 'flashcards.v1';
  let mastered = load();
  let keyHandler = null;

  function load() {
    try {
      const saved = JSON.parse(globalThis.localStorage?.getItem(KEY) || 'null');
      if (saved && typeof saved === 'object') return saved;
    } catch (e) { /* unreadable or blocked: start fresh */ }
    return {};
  }

  function save() {
    try { globalThis.localStorage?.setItem(KEY, JSON.stringify(mastered)); } catch (e) { /* keep in memory only */ }
  }

  const isMastered = (id) => !!mastered[id];
  const masteredCount = (cards) => cards.filter((c) => isMastered(c.id)).length;

  function setMastered(id, on) {
    if (on) mastered[id] = true;
    else delete mastered[id];
    save();
  }

  function reset() {
    mastered = {};
    save();
  }

  // Runs a study session for `deck` ({ title, cards: [{ id, front, back, tag }] }) inside `host`.
  // opts: { onExit() — leave the deck, onDone() — finished a pass, onChange() — mastery changed }
  function study(host, deck, opts = {}) {
    const settings = { shuffle: false, reverse: false, onlyNew: false };
    let queue = [];
    let index = 0;
    let flipped = false;
    let results = {}; // id → 'got' | 'learning'

    function start(cards) {
      const base = cards || deck.cards.filter((c) => !settings.onlyNew || !isMastered(c.id));
      queue = settings.shuffle ? Util.shuffle(base) : base.slice();
      index = 0;
      flipped = false;
      results = {};
      draw();
    }

    const count = (kind) => Object.values(results).filter((r) => r === kind).length;
    const faces = (card) => (settings.reverse ? [card.back, card.front] : [card.front, card.back]);

    function toolbar() {
      const left = deck.cards.length - masteredCount(deck.cards);
      const toggle = (opt, label) => `<button type="button" class="fc-toggle" data-opt="${opt}" aria-pressed="${settings[opt]}">${label}</button>`;
      return `
        <div class="fc-toolbar">
          ${toggle('shuffle', '🔀 Shuffle')}
          ${toggle('reverse', '↔ Definition first')}
          ${toggle('onlyNew', `🎯 Not mastered yet (${left})`)}
        </div>`;
    }

    function draw() {
      if (!queue.length) {
        host.innerHTML = `
          ${toolbar()}
          <div class="fc-empty">
            <p class="empty-icon" aria-hidden="true">🏆</p>
            <h3>You've mastered every card in this deck!</h3>
            <p class="muted">Turn off "Not mastered yet" to review them all again.</p>
          </div>`;
        wireToolbar();
        return;
      }
      if (index >= queue.length) return summary();
      const card = queue[index];
      const [front, back] = faces(card);
      host.innerHTML = `
        ${toolbar()}
        <div class="fc-status">
          <span>Card <strong>${index + 1}</strong> of ${queue.length}</span>
          <span><span class="good-text">✅ ${count('got')}</span> · <span class="hint-text">😅 ${count('learning')}</span></span>
        </div>
        <div class="progress" aria-hidden="true"><div class="progress-bar" style="width:${(index / queue.length) * 100}%"></div></div>
        <button type="button" class="fc-card" aria-label="Flashcard. Press to flip.">
          <span class="fc-inner">
            <span class="fc-face fc-front">
              <span class="fc-tag">${card.tag}${isMastered(card.id) ? ' · ✅ mastered' : ''}</span>
              <span class="fc-text">${front}</span>
              <span class="fc-hint">Tap to flip</span>
            </span>
            <span class="fc-face fc-back" aria-hidden="true">
              <span class="fc-tag">${settings.reverse ? 'Term' : 'Answer'}</span>
              <span class="fc-text fc-text-back">${back}</span>
            </span>
          </span>
        </button>
        <div class="fc-actions" data-when="front">
          <button type="button" class="btn btn-ghost" data-act="prev" ${index === 0 ? 'disabled' : ''}>← Back</button>
          <button type="button" class="btn btn-primary" data-act="flip">Flip card</button>
          <button type="button" class="btn btn-ghost" data-act="skip">Skip →</button>
        </div>
        <div class="fc-actions" data-when="back" hidden>
          <button type="button" class="btn fc-learning" data-act="learning">😅 Still learning</button>
          <button type="button" class="btn btn-primary" data-act="got">✅ Got it</button>
        </div>
        <p class="muted small fc-keys">Keyboard: <kbd>Space</kbd> flip · <kbd>1</kbd> still learning · <kbd>2</kbd> got it · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
      wireToolbar();
      host.querySelector('.fc-card').addEventListener('click', flip);
      host.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => act(b.dataset.act)));
      if (flipped) setFlipped(true);
      else if (index > 0 || Object.keys(results).length) host.querySelector('.fc-card').focus({ preventScroll: true });
    }

    function setFlipped(on) {
      flipped = on;
      const cardEl = host.querySelector('.fc-card');
      if (!cardEl) return;
      cardEl.classList.toggle('is-flipped', on);
      cardEl.querySelector('.fc-front').setAttribute('aria-hidden', String(on));
      cardEl.querySelector('.fc-back').setAttribute('aria-hidden', String(!on));
      host.querySelector('[data-when="front"]').hidden = on;
      host.querySelector('[data-when="back"]').hidden = !on;
      cardEl.focus({ preventScroll: true });
    }

    function flip() { setFlipped(!flipped); }

    function act(kind) {
      const card = queue[index];
      if (kind === 'flip') return flip();
      if (kind === 'prev') { if (index > 0) { index--; flipped = false; draw(); } return; }
      if (kind === 'skip') { index++; flipped = false; return draw(); }
      if (!flipped) return;
      results[card.id] = kind;
      setMastered(card.id, kind === 'got');
      opts.onChange?.();
      index++;
      flipped = false;
      draw();
    }

    function summary() {
      const got = count('got');
      const learning = queue.filter((c) => results[c.id] === 'learning');
      const total = deck.cards.length;
      const done = masteredCount(deck.cards);
      host.innerHTML = `
        <div class="fc-summary">
          <p class="empty-icon" aria-hidden="true">${learning.length ? '💪' : '🌟'}</p>
          <h3>${learning.length ? 'Nice work! Keep going.' : 'Perfect round!'}</h3>
          <div class="stats">
            <div class="stat good"><span class="stat-value">${got}</span><span class="stat-label">Got it</span></div>
            <div class="stat"><span class="stat-value">${learning.length}</span><span class="stat-label">Still learning</span></div>
            <div class="stat"><span class="stat-value">${done}<small>/${total}</small></span><span class="stat-label">Deck mastered</span></div>
          </div>
          <div class="actions">
            ${learning.length ? `<button type="button" class="btn btn-primary" data-sum="learning">Study the ${learning.length} I'm still learning</button>` : ''}
            <button type="button" class="btn btn-secondary" data-sum="again">Start the deck over</button>
            <button type="button" class="btn btn-ghost" data-sum="exit">← Back to unit</button>
          </div>
        </div>`;
      host.querySelector('[data-sum="learning"]')?.addEventListener('click', () => start(learning));
      host.querySelector('[data-sum="again"]').addEventListener('click', () => start());
      host.querySelector('[data-sum="exit"]').addEventListener('click', () => opts.onExit?.());
      opts.onDone?.();
    }

    function wireToolbar() {
      host.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => {
        settings[b.dataset.opt] = !settings[b.dataset.opt];
        if (b.dataset.opt === 'reverse') { flipped = false; draw(); } else start();
      }));
    }

    // One keyboard handler at a time; it removes itself once this deck leaves the page.
    if (keyHandler) document.removeEventListener('keydown', keyHandler);
    keyHandler = (e) => {
      if (!host.isConnected) { document.removeEventListener('keydown', keyHandler); keyHandler = null; return; }
      if (e.target.closest?.('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (!host.querySelector('.fc-card')) return;
      const keys = { ' ': 'flip', Enter: 'flip', 1: 'learning', 2: 'got', ArrowLeft: 'prev', ArrowRight: 'skip' };
      const kind = keys[e.key];
      if (!kind) return;
      // Let Enter/Space on a focused button act as a normal click.
      if ((e.key === ' ' || e.key === 'Enter') && e.target.closest?.('button')) return;
      e.preventDefault();
      act(kind);
    };
    document.addEventListener('keydown', keyHandler);

    start();
  }

  return { study, isMastered, masteredCount, reset };
})();

</script>

      explanation: 'Point to where your evidence comes from, like "In Chapter 4, the text says…" or "On page __, it states…"' },
  ];

  const toQuestion = (skill, prompt, options, explanation, hint) => {
    const opts = shuffle(options.map(([html, h], i) => ({ html, correct: i === 0, hint: h })))
      .map((o, i) => ({ ...o, id: 'ABCD'[i] }));
    return {
      type: skill, skill: SKILLS[skill],
      prompt, summary: prompt.replace(/<br>/g, ' ').replace(/<[^>]+>/g, ''),
      format: 'mc', options: opts, textOptions: true,
      check: (id) => {
        const opt = opts.find((o) => o.id === id);
        if (!opt) return { status: 'invalid', message: 'Choose one of the answers.' };
        return opt.correct ? { status: 'correct' } : { status: 'incorrect', message: opt.hint };
      },
      hint: hint || 'Look back at the lesson, and use your book to check the details.',
      explanation, solution: options[0][0],
    };
  };

  // ---------- Generated questions ----------

  const VAGUE = ['Percy has a strange day.', 'Some things happen to Percy.', 'Percy learns a lot.', 'Percy goes on an adventure.'];

  // "Which is the best gist of Chapter N?" One factory per chapter.
  const gistFactories = CHAPTERS.map(([n, , , gist, detail]) => () => {
    const [other] = shuffle(CHAPTERS.filter((c) => c[0] !== n));
    return toQuestion('gist', `Which sentence is the best <strong>gist</strong> of Chapter ${n}?`, [
      [gist],
      [detail, 'That is a true detail, but it is too small. A gist covers the main idea of the whole chapter.'],
      [pick(VAGUE), 'That is too general. A gist says who, what happens, and why it matters.'],
      [other[3], `That is the gist of Chapter ${other[0]}.`],
    ], `The gist of Chapter ${n}: ${gist}`, 'A gist is a short summary of the most important idea: who, what happens, and why it matters.');
  });

  // Four events from four different chapters, so their order is clear.
  function pickEvents(k) {
    const chosen = [];
    for (const e of shuffle(EVENTS)) {
      if (!chosen.some((c) => c[0] === e[0])) chosen.push(e);
      if (chosen.length === k) break;
    }
    return chosen.sort((a, b) => a[0] - b[0]);
  }

  const sequenceFactories = [
    () => {
      const ev = pickEvents(4);
      return toQuestion('sequence', 'Which event happens <strong>first</strong>?', [
        [ev[0][1]], ...ev.slice(1).map((e) => [e[1], `That happens in Chapter ${e[0]}. Look for an event from an earlier chapter.`]),
      ], `${ev[0][1]} happens in Chapter ${ev[0][0]}, before the others.`, 'Think about where each event happens: Yancy, home, the road to camp, or at camp.');
    },
    () => {
      const ev = pickEvents(4);
      return toQuestion('sequence', 'Which event happens <strong>last</strong>?', [
        [ev[3][1]], ...ev.slice(0, 3).map((e) => [e[1], `That happens in Chapter ${e[0]}. Look for an event from a later chapter.`]),
      ], `${ev[3][1]} happens in Chapter ${ev[3][0]}, after the others.`, 'Think about where each event happens: Yancy, home, the road to camp, or at camp.');
    },
    () => {
      // A, then the answer, then B; distractors happen outside that window.
      const [before, a, mid, b, after] = pickEvents(5);
      return toQuestion('sequence', `Which event happens <strong>between</strong> these two?<br>1. ${a[1]}<br>2. ${b[1]}`, [
        [mid[1]],
        [before[1], `That happens in Chapter ${before[0]}, before "${a[1]}"`],
        [after[1], `That happens in Chapter ${after[0]}, after "${b[1]}"`],
        [a[1], 'That is the first event listed. Find one that happens after it.'],
      ], `The order is: ${a[1]} (Ch. ${a[0]}) → ${mid[1]} (Ch. ${mid[0]}) → ${b[1]} (Ch. ${b[0]})`, 'Put the two listed events in order, then find what happens in the middle.');
    },
  ];

  const FACTORIES = {
    gist: gistFactories,
    sequence: sequenceFactories,
  };
  BANK.forEach((item) => (FACTORIES[item.skill] ||= []).push(() => toQuestion(item.skill, item.prompt, item.options, item.explanation)));

  // Picks `count` different questions from the given skills, rotating through skills so each one shows up.
  function buildSession(skills, count) {
    const seen = new Set();
    const pools = shuffle(skills).map((skill) => FACTORIES[skill]);
    const picked = [];
    for (let tries = 0; picked.length < count && tries < 50; tries++) {
      for (const pool of pools) {
        if (picked.length >= count) break;
        const q = pick(pool)();
        if (seen.has(q.summary)) continue;
        seen.add(q.summary);
        picked.push(q);
      }
    }
    return shuffle(picked);
  }

  return { SKILLS, CHAPTERS, EVENTS, STAGES, PLOT, TRAITS, RACES, SCOPE, CHAPTER_QA, JOURNEY_QA, MODEL_RESPONSES, CH8_KEY, BANK, FACTORIES, buildSession };
})();

  function sequencer(el, selector, events) {
