<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6th Grader Learning Hub</title>
  <style>
:root {
  --app-bg: #000000;
  --bg: #1f1f1f;
  --panel: #121212;
  --surface: #181818;
  --surface-2: #282828;
  --ink: #ffffff;
  --muted: #b3b3b3;
  --line: #333333;
  --primary: #1ed760;
  --primary-ink: #000000;
  --primary-soft: #1d3527;
  --good: #1ed760;
  --good-soft: #173526;
  --bad: #ff6b6b;
  --bad-soft: #3d1f1d;
  --hint: #f5c35b;
  --hint-soft: #3a2f14;
  --radius: 10px;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--app-bg);
  color: var(--ink);
  font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

h1, h2, h3 { line-height: 1.25; margin: 0 0 .6em; }
h1 { font-size: 2rem; font-weight: 900; letter-spacing: -.02em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; margin-top: 1.6em; }
h1:focus, h2:focus { outline: none; }
p { margin: 0 0 .9em; }

.container { padding: 0 0 60px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
}

.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* ---------- Shell (Spotify-style: black frame, rounded panels) ---------- */
.layout { display: flex; align-items: flex-start; gap: 8px; min-height: 100vh; padding: 8px; }
.sidebar {
  position: sticky; top: 8px; flex: none; width: 290px; height: calc(100vh - 16px);
  display: flex; flex-direction: column; gap: 8px;
}
.side-panel { background: var(--panel); border-radius: var(--radius); padding: 12px; }
.side-library { flex: 1; overflow-y: auto; }
#app {
  position: relative; flex: 1; min-width: 0; min-height: calc(100vh - 16px);
  background: var(--panel); border-radius: var(--radius); overflow: hidden;
}
.view-tint {
  position: absolute; inset: 0 0 auto; height: 340px; pointer-events: none;
  background: linear-gradient(180deg, var(--tint) 0%, transparent 100%); opacity: .55;
}
.narrow, .wide, .topbar { position: relative; }
.narrow { max-width: 780px; margin: 0 auto; padding: 8px 24px 0; }
.wide { padding: 8px 24px 0; }

/* ---------- Footer ---------- */
.site-footer {
  position: relative; margin: 48px 24px 0; padding: 20px 0 8px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: .8rem; line-height: 1.5;
}
.site-footer p { max-width: 760px; }
.site-footer .copyright { font-weight: 700; color: var(--ink); margin-bottom: 0; }

/* ---------- Sidebar ---------- */
.nav-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.nav-brand-logo {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; font-size: 1.4rem;
  border-radius: 50%; background: var(--primary); animation: rocket-bob 3s ease-in-out infinite;
}
.nav-brand-title { font-size: 1.05rem; font-weight: 900; line-height: 1.15; letter-spacing: -.01em; }
@keyframes rocket-bob {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-3px) rotate(6deg); }
}
.nav-link, .library-row {
  display: flex; align-items: center; width: 100%; text-align: left; font: inherit; cursor: pointer;
  background: none; border: 0; border-radius: 6px; color: var(--muted);
}
.nav-link { gap: 14px; padding: 9px 10px; font-size: .98rem; font-weight: 700; transition: color .15s; }
.nav-link:hover, .nav-link.is-active { color: var(--ink); }
.nav-ico { width: 24px; text-align: center; font-size: 1.15rem; }
.library-head { display: flex; gap: 10px; align-items: center; margin: 2px 8px 12px; font-weight: 700; color: var(--muted); }
.library-row { gap: 12px; padding: 8px; color: var(--ink); }
.library-row:hover { background: var(--surface-2); }
.library-row.is-active { background: var(--surface-2); }
.library-row.is-active .library-title { color: var(--primary); }
.library-text { display: flex; flex-direction: column; min-width: 0; }
.library-title { font-weight: 700; }
.library-meta { font-size: .82rem; color: var(--muted); }
.library-lessons { margin: 2px 0 8px 22px; padding-left: 12px; border-left: 2px solid var(--line); }
.nav-lesson { display: block; font-size: .88rem; font-weight: 500; line-height: 1.35; padding: 6px 8px; }
.nav-lesson:hover { background: var(--surface-2); }
.nav-lesson.is-active { color: var(--primary); font-weight: 700; }
.nav-unit { font-weight: 600; }
.nav-unit + .library-lessons { margin-left: 14px; }
.nav-unit.is-soon:not(.is-active) { opacity: .55; }
.nav-link:focus-visible, .library-row:focus-visible { outline: 3px solid var(--ink); outline-offset: -2px; }
.mobile-bar { display: none; }
.nav-check {
  display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 4px;
  border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-size: .65rem; font-weight: 800;
}

/* ---------- Cover art (playlist-style squares) ---------- */
.cover {
  position: relative; display: flex; flex-direction: column; justify-content: space-between;
  aspect-ratio: 1; padding: 12px; border-radius: 6px; overflow: hidden; color: #fff;
  background: linear-gradient(140deg, var(--cover) 0%, color-mix(in srgb, var(--cover) 45%, #000) 100%);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
}
.cover::after {
  content: ""; position: absolute; right: -25%; bottom: -25%; width: 70%; aspect-ratio: 1;
  border-radius: 50%; background: rgba(255, 255, 255, .12);
}
.cover-icon { font-size: 2.6rem; line-height: 1; }
.cover-title { position: relative; z-index: 1; font-weight: 900; font-size: 1.25rem; line-height: 1.1; letter-spacing: -.01em; }
.cover-sm { flex: none; width: 48px; padding: 0; border-radius: 4px; justify-content: center; align-items: center; box-shadow: none; }
.cover-sm .cover-icon { font-size: 1.4rem; }
.cover-sm .cover-title, .cover-sm::after { display: none; }
.cover-lg { flex: none; width: 200px; padding: 18px; }
.cover-lg .cover-icon { font-size: 4rem; }
.cover-lg .cover-title { font-size: 1.6rem; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding: 16px 24px 0; }
.round-btn {
  flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(0, 0, 0, .6); color: var(--ink); font-size: 1.5rem; line-height: 1; padding-bottom: 3px;
}
.round-btn:hover:not(:disabled) { background: #000; transform: scale(1.06); }
.round-btn:disabled { opacity: .4; cursor: default; }
.round-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.crumb { font: inherit; color: var(--muted); background: none; border: 0; padding: 2px; cursor: pointer; font-weight: 600; }
.crumb:hover { color: var(--ink); text-decoration: underline; }
.crumb-current { color: var(--ink); font-weight: 700; }

/* ---------- Home & subject pages ---------- */
.home-head { padding: 28px 0 8px; }
.home-head h1 { font-size: 2.4rem; }
.shelf-title { font-size: 1.5rem; font-weight: 800; margin: 24px 0 14px; }
.tile-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left;
  padding: 14px; border: 0; border-radius: 8px; background: var(--surface); color: var(--ink);
  font: inherit; transition: background .2s;
}
.tile:hover { background: var(--surface-2); }
.subject-tile { cursor: pointer; }
.tile-cover { position: relative; display: block; margin-bottom: 10px; }
.subject-tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.tile-title { font-weight: 800; font-size: 1.05rem; margin: 0; }
.tile-meta { color: var(--muted); font-size: .88rem; margin: 0; }
.tile-foot { color: var(--muted); font-size: .78rem; margin-top: 4px; }
.play-fab {
  display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 0;
  background: var(--primary); color: var(--primary-ink); font-size: 1.1rem; padding-left: 3px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, .35);
}
.subject-tile .play-fab {
  position: absolute; right: 8px; bottom: 8px; z-index: 2;
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
}
.subject-tile:hover .play-fab, .subject-tile:focus-visible .play-fab { opacity: 1; transform: none; }
.soon-pill {
  align-self: flex-start; margin-top: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink); font-size: .74rem; font-weight: 700;
}

.subject-hero { display: flex; align-items: flex-end; gap: 24px; padding: 24px 0 8px; }
.subject-hero-text { min-width: 0; }
.subject-hero .eyebrow { color: var(--ink); }
.subject-name { font-size: clamp(2.4rem, 7vw, 4.8rem); line-height: 1; margin: 0 0 12px; }
.subject-name.is-long { font-size: clamp(1.9rem, 4.5vw, 3.2rem); }
.subject-actions { display: flex; align-items: center; gap: 24px; margin: 24px 0 0; }
.play-fab-lg { width: 56px; height: 56px; font-size: 1.3rem; cursor: pointer; transition: transform .15s; }
.play-fab-lg:hover { transform: scale(1.06); }
.play-fab-lg:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.subject-progress { flex: 1; max-width: 360px; }
.subject-progress .completion { margin: 0; }
.lesson-tiles { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.lesson-tile { padding: 16px; }
.lesson-tile .actions { margin-top: auto; padding-top: 12px; }
.lesson-art {
  display: flex; justify-content: center; align-items: center; min-height: 120px; margin-bottom: 10px;
  border-radius: 6px; background: var(--surface-2);
}
.lesson-art .diagram { max-height: 90px; }
.lesson-emoji { font-size: 3.2rem; line-height: 1; }
.empty-state { text-align: center; padding: 48px 16px; }
.empty-icon { font-size: 3.5rem; margin-bottom: 8px; }

@media (prefers-reduced-motion: reduce) {
  .nav-brand-logo { animation: none; }
  .subject-tile .play-fab { transition: none; }
}

/* ---------- Completion & scores ---------- */
.completion { margin: 4px 0 18px; }
.completion .progress { margin: 4px 0 6px; }
.completion-head { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 700; }
.completion.compact { margin: 0; }
.completion.compact .progress { height: 6px; margin: 2px 0 4px; }
.completion.compact .completion-head { font-size: .75rem; color: var(--muted); }
.lesson-status { list-style: none; padding: 0; margin: 0 0 4px; font-size: .88rem; color: var(--muted); }
.lesson-status li { margin-bottom: 2px; }
.lesson-status li.done { color: var(--good); }
.lesson-status strong { color: var(--ink); }
.good-text { color: var(--good); font-weight: 600; }
.bad-text { color: var(--bad); font-weight: 600; }
.session-table td:first-child { white-space: nowrap; }
.qa .session-table { margin-bottom: 0; }

@media (max-width: 860px) {
  .layout { padding: 0; gap: 0; }
  #app { border-radius: 0; min-height: calc(100vh - 51px); }
  .mobile-bar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    background: #000; padding: 8px 16px;
  }
  .mobile-title { font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar {
    display: none; position: fixed; top: 51px; left: 0; bottom: 0; z-index: 30; height: auto;
    width: min(320px, 88vw); padding: 8px; background: #000; box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
  }
  .menu-open .sidebar { display: flex; }
  .narrow, .wide { padding: 8px 16px 0; }
  .topbar { padding: 12px 16px 0; }
  .site-footer { margin: 40px 16px 0; }
  .subject-hero { flex-direction: column; align-items: flex-start; gap: 16px; }
  .cover-lg { width: 150px; }
  .tile-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .lesson-tiles { grid-template-columns: 1fr; }
  .subject-tile .play-fab { display: none; }
}

/* ---------- Cards & layout ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
}

.glossary { margin: 0; }
.glossary dt { font-weight: 700; margin-top: 12px; }
.glossary dd { margin: 2px 0 0; color: var(--ink); }
.gist { margin: 6px 0 0; padding: 6px 10px; border-left: 3px solid var(--primary); background: var(--bg); border-radius: 0 8px 8px 0; }
.mb0 { margin-bottom: 0; }

.checklist, .tips { padding-left: 0; list-style: none; }
.checklist li, .tips li { margin-bottom: 10px; }
.checklist li::before { content: "☐ "; color: var(--primary); font-weight: 700; }

.qa-list { display: grid; gap: 8px; margin: 12px 0; }
.qa { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
.qa summary { cursor: pointer; font-weight: 600; }
.qa[open] summary { margin-bottom: 8px; color: var(--primary); }
.qa-answer { padding-left: 12px; border-left: 3px solid var(--good); }

.timeline { padding-left: 1.6em; margin: 12px 0; min-height: 1em; }
.timeline li { margin-bottom: 6px; padding: 6px 10px; background: var(--good-soft); border-radius: 8px; }
.seq-options .btn { text-align: left; }

.plot .plot-seg { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
.plot .plot-seg.on { stroke: var(--primary); }
.plot .plot-dot { fill: var(--line); stroke: none; }
.plot .plot-dot.on { fill: var(--primary); }
.plot .plot-here { fill: var(--hint); }

.map-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: .95rem; }
.map-table th, .map-table td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.map-table th { color: var(--muted); font-size: .85rem; }

.races-model { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.races-sentence { margin: 0 0 6px; }
.races-model.labeled .races-sentence { padding: 4px 0; }
.races-tag {
  display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 4px;
  border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-size: .8rem; font-weight: 800;
}

.eyebrow { font-size: .82rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.dots { display: flex; gap: 6px; margin-bottom: 16px; }
.dot { width: 28px; height: 5px; border-radius: 3px; background: var(--line); }
.dot.on { background: var(--primary); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.nav-actions { justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; }

/* ---------- Buttons ---------- */
.btn {
  font: inherit; font-weight: 600; font-size: 1rem;
  border-radius: 999px; border: 2px solid transparent;
  padding: 10px 20px; cursor: pointer; min-height: 44px;
  transition: background .12s, border-color .12s, transform .05s;
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible, [data-obj]:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.btn:disabled { cursor: default; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { filter: brightness(1.08); transform: scale(1.03); }
.btn-secondary { background: transparent; color: var(--ink); border-color: #7c7c7c; }
.btn-secondary:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }
.btn-ghost.small { padding: 4px 12px; min-height: 34px; font-size: .88rem; }
.btn-option { border-radius: 10px; background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn-option:hover:not(:disabled) { border-color: var(--primary); }
.btn-option.is-selected { border-color: var(--primary); background: var(--primary-soft); }
.btn-option.is-correct, .btn-option.is-answer { border-color: var(--good); background: var(--good-soft); }
.btn-option.is-wrong { border-color: var(--bad); background: var(--bad-soft); opacity: .8; }
.btn-round { width: 44px; height: 44px; padding: 0; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 1.4rem; line-height: 1; }

/* ---------- Diagrams ---------- */
.diagram-box {
  display: flex; justify-content: center; align-items: center;
  background: var(--bg); border: 1px dashed var(--line); border-radius: 12px;
  padding: 16px; margin: 14px 0; min-height: 80px; overflow-x: auto;
}
.diagram { max-width: 100%; height: auto; }
.tape-label { fill: var(--ink); font: 600 13px system-ui, sans-serif; }
.countable [data-obj] { cursor: pointer; transition: opacity .12s; }
.countable [data-obj]:not(.counted) { opacity: .45; }
.countable [data-obj].counted { opacity: 1; stroke: var(--ink); stroke-width: 3; }
.counters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 1.1rem; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
.chip-icon { width: 20px; height: 20px; }

.big-ratio { font-size: 2rem; font-weight: 800; letter-spacing: .02em; color: var(--primary); margin: .2em 0; }
.big-ratio.inline { font-size: 1.35rem; display: inline-block; margin: 0 .2em; }

.callout {
  background: var(--primary-soft); border-radius: 10px; padding: 14px 16px; margin: 14px 0;
}
.reveal-box { margin-top: 14px; }
.notation-tabs, .mini-options { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.mini-feedback { min-height: 1.5em; margin-top: 8px; }
.mini-feedback.good { color: var(--good); }
.mini-feedback.bad { color: var(--bad); }
.language-list { padding-left: 1.2em; }
.language-list li { margin-bottom: 6px; }

.stepper-row { display: flex; flex-wrap: wrap; gap: 16px 28px; margin: 12px 0; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper-label { font-weight: 600; min-width: 3em; text-transform: capitalize; }
.stepper-value { font-size: 1.3rem; font-weight: 700; min-width: 1.5em; text-align: center; }

/* ---------- Ratio unit visuals ---------- */
.dnl-value { fill: var(--ink); font: 700 15px system-ui, sans-serif; }
.dnl-small { fill: var(--muted); font: 600 11px system-ui, sans-serif; }
.tape-box-text { fill: #fff; font: 800 15px system-ui, sans-serif; }
.ratio-table { border-collapse: collapse; margin: 14px auto; min-width: 260px; font-size: 1rem; }
.ratio-table caption { caption-side: top; color: var(--muted); font-size: .85rem; padding-bottom: 6px; }
.ratio-table th, .ratio-table td { border: 2px solid var(--line); padding: 8px 16px; text-align: center; }
.ratio-table th { background: var(--surface-2); font-size: .85rem; color: var(--ink); }
.ratio-table td { font-weight: 700; font-variant-numeric: tabular-nums; }
.diagram-box .ratio-table { margin: 0; }
.blank {
  display: inline-block; min-width: 2.2em; padding: 0 6px; border-radius: 6px;
  border: 2px dashed var(--hint); background: var(--hint-soft); color: var(--hint);
}
.targets li { padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.swatch {
  display: inline-block; width: 64px; height: 64px; border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, .2); vertical-align: middle;
}
.swatch-empty { display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: .75rem; }
.swatch-row { display: flex; gap: 10px; }
.swatch-row .swatch { width: 48px; height: 48px; }
.mix-lab { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 16px; border-radius: 12px; background: var(--surface-2); margin: 12px 0; }
.mix-target { text-align: center; }
.mix-target p { margin-bottom: 6px; }
.mix-result { display: flex; align-items: center; gap: 14px; }
.mix-result .mini-feedback { margin: 0; }
.lesson-art .dnl, .lesson-art .tape, .lesson-art .batches { max-height: 100px; }

/* ---------- Social studies visuals ---------- */
.fact-card {
  display: flex; gap: 16px; align-items: flex-start; margin: 4px 0 16px; padding: 16px; border-radius: 12px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--civ) 35%, var(--surface-2)), var(--surface-2));
}
.fact-icon { font-size: 2.6rem; line-height: 1; }
.fact-card dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 18px; margin: 0; flex: 1; }
.fact-card dt { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.fact-card dd { margin: 0; font-weight: 600; }
.season-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 12px 0; }
.season { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.season > span:first-child { font-size: 1.6rem; }
.season > span:last-child { color: var(--muted); font-size: .92rem; }
.hierarchy { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 16px 0; }
.hierarchy div {
  width: var(--w); padding: 7px 10px; text-align: center; font-weight: 700; font-size: .9rem; border-radius: 6px;
  background: color-mix(in srgb, #b45309 calc(100% - var(--w) * .6), var(--surface-2));
}

  <script>
// Small shared helpers. Everything hangs off window so the app runs from file:// with no build step.
const Util = (() => {
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Two different items from a list.
  function pickTwo(arr) {
    const [x, y] = shuffle(arr);
    return [x, y];
  }

  // Two different counts in [min, max].
  function twoCounts(min, max) {
    const a = randInt(min, max);
    let b = randInt(min, max);
    while (b === a) b = randInt(min, max);
    return [a, b];
  }

  // Parses "3:2", "3 : 2", "3 to 2", "3/2". Returns [x, y] or null.
  function parseRatio(str) {
    if (typeof str !== 'string') return null;
    const m = str.trim().toLowerCase().match(/^(\d+)\s*(?::|\/|to)\s*(\d+)$/);
    if (!m) return null;
    return [parseInt(m[1], 10), parseInt(m[2], 10)];
  }

  function gcd(a, b) {
    return b === 0 ? a : gcd(b, a % b);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  return { randInt, pick, shuffle, pickTwo, twoCounts, parseRatio, gcd, escapeHtml };
})();

</script>
  <script>
// Saved progress: which lessons were read to the end, and every finished practice session.
// Kept in localStorage on this device; falls back to memory if storage is blocked (private window, file:// quirks).
const Progress = (() => {
  const KEY = 'studyProgress.v1';
  const empty = () => ({ learned: {}, sessions: [] });
  let data = load();

  function load() {
    try {
      const saved = JSON.parse(globalThis.localStorage?.getItem(KEY) || 'null');
      if (saved && saved.learned && Array.isArray(saved.sessions)) return saved;
    } catch (e) { /* unreadable or blocked: start fresh */ }
    return empty();
  }

  function save() {
    try { globalThis.localStorage?.setItem(KEY, JSON.stringify(data)); } catch (e) { /* keep in memory only */ }
  }

  function markLearned(lessonId) {
    if (data.learned[lessonId]) return;
    data.learned[lessonId] = true;
    save();
  }

  // record: { lessonId, total, correct, missed }
  function addSession(record) {
    data.sessions.push({ ...record, date: new Date().toISOString() });
    save();
  }

  const isLearned = (lessonId) => !!data.learned[lessonId];
  const sessionsFor = (lessonId) => data.sessions.filter((s) => s.lessonId === lessonId);
  const allSessions = () => data.sessions.slice();
  const percent = (s) => (s.total ? Math.round((s.correct / s.total) * 100) : 0);

  // Each lesson has two parts to complete: read the lesson, and finish a practice session.
  function completion(lessons) {
    const total = lessons.length * 2;
    const done = lessons.reduce((n, l) => n + (isLearned(l.id) ? 1 : 0) + (sessionsFor(l.id).length ? 1 : 0), 0);
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  function reset() {
    data = empty();
    save();
  }

  return { markLearned, addSession, isLearned, sessionsFor, allSessions, percent, completion, reset };
})();

</script>
  <script>
// SVG ratio diagrams, generated entirely from data ({ a, b, itemA, itemB, layout }).
const Diagrams = (() => {
  // Each object kind has a distinct colour AND shape so diagrams are readable without colour vision.
  const ITEMS = {
    red:    { key: 'red',    name: 'red circles',     single: 'red circle',     color: '#e5484d', shape: 'circle' },
    blue:   { key: 'blue',   name: 'blue squares',    single: 'blue square',    color: '#2f7ae5', shape: 'square' },
    green:  { key: 'green',  name: 'green triangles', single: 'green triangle', color: '#2e9e5b', shape: 'triangle' },
    orange: { key: 'orange', name: 'orange stars',    single: 'orange star',    color: '#f08c00', shape: 'star' },
    purple: { key: 'purple', name: 'purple diamonds', single: 'purple diamond', color: '#8e4ec6', shape: 'diamond' },
  };
  const ITEM_KEYS = Object.keys(ITEMS);

  const CELL = 40;    // grid cell size in SVG units
  const R = 14;       // shape "radius"
  const PER_ROW = 5;  // objects per row inside a group
  const GROUP_GAP = 36;

  function shape(item, cx, cy, extra = '') {
    const fill = `fill="${item.color}" stroke="rgba(0,0,0,.28)" stroke-width="1.5" ${extra}`;
    switch (item.shape) {
      case 'circle':
        return `<circle cx="${cx}" cy="${cy}" r="${R}" ${fill}/>`;
      case 'square':
        return `<rect x="${cx - R + 1}" y="${cy - R + 1}" width="${2 * R - 2}" height="${2 * R - 2}" rx="3" ${fill}/>`;
      case 'triangle':
        return `<polygon points="${cx},${cy - R} ${cx + R},${cy + R - 2} ${cx - R},${cy + R - 2}" ${fill}/>`;
      case 'diamond':
        return `<polygon points="${cx},${cy - R} ${cx + R},${cy} ${cx},${cy + R} ${cx - R},${cy}" ${fill}/>`;
      case 'star': {
        const pts = [];
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? R + 1 : R * 0.45;
          const ang = -Math.PI / 2 + (i * Math.PI) / 5;
          pts.push(`${(cx + rad * Math.cos(ang)).toFixed(1)},${(cy + rad * Math.sin(ang)).toFixed(1)}`);
        }
        return `<polygon points="${pts.join(' ')}" ${fill}/>`;
      }
      default:
        return '';
    }
  }

  function label(a, b, itemA, itemB) {
    return `Diagram showing ${a} ${a === 1 ? itemA.single : itemA.name} and ${b} ${b === 1 ? itemB.single : itemB.name}`;
  }

  function svgWrap(w, h, body, aria, cls = '') {
    return `<svg class="diagram ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${aria}" preserveAspectRatio="xMidYMid meet">${body}</svg>`;
  }

  // Draws one group as a block of rows; returns { body, w, h }.
  function groupBlock(n, item, x0, y0, dataAttr) {
    const cols = Math.max(1, Math.min(n, PER_ROW));
    const rows = Math.max(1, Math.ceil(n / PER_ROW));
    let body = '';
    for (let i = 0; i < n; i++) {
      const cx = x0 + (i % PER_ROW) * CELL + CELL / 2;
      const cy = y0 + Math.floor(i / PER_ROW) * CELL + CELL / 2;
      body += shape(item, cx, cy, dataAttr ? `data-obj="${dataAttr}" data-i="${i}"` : '');
    }
    return { body, w: cols * CELL, h: rows * CELL };
  }

  // Two separate groups side by side: [A A A]   [B B]
  function grouped({ a, b, itemA, itemB, countable = false }) {
    const pad = 6;
    const blockA = groupBlock(a, itemA, pad, pad, countable ? 'a' : null);
    const xB = pad + blockA.w + (a > 0 ? GROUP_GAP : 0);
    const blockB = groupBlock(b, itemB, xB, pad, countable ? 'b' : null);
    const w = xB + (b > 0 ? blockB.w : 0) + pad;
    const h = Math.max(blockA.h, blockB.h, CELL) + pad * 2;
    return svgWrap(w, h, blockA.body + blockB.body, label(a, b, itemA, itemB));
  }

  // Objects mixed together in a grid, in the given order (array of 'a' / 'b').
  function mixed({ a, b, itemA, itemB, order, countable = false }) {
    const seq = order || Util.shuffle([...Array(a).fill('a'), ...Array(b).fill('b')]);
    const cols = Math.min(seq.length, 6);
    const rows = Math.ceil(seq.length / cols);
    const pad = 6;
    let body = '';
    const counters = { a: 0, b: 0 };
    seq.forEach((k, i) => {
      const cx = pad + (i % cols) * CELL + CELL / 2;
      const cy = pad + Math.floor(i / cols) * CELL + CELL / 2;
      const attr = countable ? `data-obj="${k}" data-i="${counters[k]++}"` : '';
      body += shape(k === 'a' ? itemA : itemB, cx, cy, attr);
    });
    return svgWrap(cols * CELL + pad * 2, rows * CELL + pad * 2, body, label(a, b, itemA, itemB));
  }

  // One row per quantity: A on top, B below, lined up from the left.
  function rows({ a, b, itemA, itemB }) {
    const pad = 6;
    const cols = Math.max(a, b, 1);
    let body = '';
    for (let i = 0; i < a; i++) body += shape(itemA, pad + i * CELL + CELL / 2, pad + CELL / 2);
    for (let i = 0; i < b; i++) body += shape(itemB, pad + i * CELL + CELL / 2, pad + CELL * 1.5);
    return svgWrap(cols * CELL + pad * 2, CELL * 2 + pad * 2, body, label(a, b, itemA, itemB));
  }

  // Tape diagram: a strip of equal boxes per quantity, with a text label.
  function tape({ a, b, itemA, itemB }) {
    const pad = 6;
    const labelW = 70;
    const box = 34;
    const cols = Math.max(a, b, 1);
    let body = '';
    const row = (n, item, y, text) => {
      body += `<text x="${pad}" y="${y + box / 2 + 5}" class="tape-label">${text}</text>`;
      for (let i = 0; i < n; i++) {
        body += `<rect x="${pad + labelW + i * box}" y="${y}" width="${box}" height="${box}" fill="${item.color}" fill-opacity=".85" stroke="var(--ink)" stroke-width="1.5"/>`;
      }
    };
    const shortName = (item) => item.name.split(' ')[0];
    row(a, itemA, pad, shortName(itemA));
    row(b, itemB, pad + box + 10, shortName(itemB));
    return svgWrap(pad * 2 + labelW + cols * box, pad * 2 + box * 2 + 10, body, label(a, b, itemA, itemB), 'tape');
  }

  function render(spec) {
    const d = { ...spec, itemA: resolve(spec.itemA), itemB: resolve(spec.itemB) };
    switch (spec.layout) {
      case 'mixed': return mixed(d);
      case 'rows': return rows(d);
      case 'tape': return tape(d);
      default: return grouped(d);
    }
  }

  function resolve(item) {
    return typeof item === 'string' ? ITEMS[item] : item;
  }

  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // Splits a long label into two lines at the space nearest the middle.
  function twoLines(text, x, y, cls = 'tape-label') {
    const t = String(text);
    if (t.length <= 16 || !t.includes(' ')) return `<text x="${x}" y="${y}" class="${cls}">${esc(t)}</text>`;
    const mid = t.length / 2;
    let cut = -1;
    for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (cut < 0 || Math.abs(i - mid) < Math.abs(cut - mid))) cut = i;
    return `<text x="${x}" y="${y - 8}" class="${cls}"><tspan x="${x}">${esc(t.slice(0, cut))}</tspan><tspan x="${x}" dy="16">${esc(t.slice(cut + 1))}</tspan></text>`;
  }

  // Double number line: two parallel lines with matching tick marks.
  // spec: { top: { label, values }, bottom: { label, values }, hidden: ['t2', 'b3'] } — hidden cells show "?".
  function doubleNumberLine({ top, bottom, hidden = [] }) {
    const labelW = 132;
    const gap = 72;
    const pad = 22;
    const n = top.values.length;
    const w = labelW + pad * 2 + (n - 1) * gap;
    const yT = 46;
    const yB = 112;
    const x = (i) => labelW + pad + i * gap;
    let body = '';
    for (const y of [yT, yB]) {
      body += `<line x1="${labelW + 4}" y1="${y}" x2="${w - 4}" y2="${y}" stroke="var(--ink)" stroke-width="2"/>`;
      body += `<polygon points="${w - 2},${y} ${w - 12},${y - 5} ${w - 12},${y + 5}" fill="var(--ink)"/>`;
    }
    const cell = (row, i, val, y) => {
      const cx = x(i);
      if (hidden.includes(`${row}${i}`)) {
        return `<rect x="${cx - 20}" y="${y - 13}" width="40" height="22" rx="5" fill="var(--hint-soft)" stroke="var(--hint)" stroke-width="1.5" stroke-dasharray="4 3"/>`
          + `<text x="${cx}" y="${y + 4}" text-anchor="middle" class="tape-label">?</text>`;
      }
      return `<text x="${cx}" y="${y + 4}" text-anchor="middle" class="dnl-value">${esc(val)}</text>`;
    };
    for (let i = 0; i < n; i++) {
      body += `<line x1="${x(i)}" y1="${yT - 8}" x2="${x(i)}" y2="${yT + 8}" stroke="var(--ink)" stroke-width="2"/>`;
      body += `<line x1="${x(i)}" y1="${yB - 8}" x2="${x(i)}" y2="${yB + 8}" stroke="var(--ink)" stroke-width="2"/>`;
      body += cell('t', i, top.values[i], yT - 22);
      body += cell('b', i, bottom.values[i], yB + 26);
    }
    body += twoLines(top.label, 4, yT + 5);
    body += twoLines(bottom.label, 4, yB + 5);
    return svgWrap(w, 152, body, `Double number line: ${top.label} ${top.values.join(', ')}; ${bottom.label} ${bottom.values.join(', ')}`, 'dnl');
  }

  // Batches of a recipe or mixture: n boxes, each holding a of itemA and b of itemB.
  function batches({ a, b, itemA, itemB, n }) {
    const A = resolve(itemA);
    const B = resolve(itemB);
    const cols = Math.max(a, b, 1);
    const bw = cols * CELL + 12;
    const bh = CELL * 2 + 28;
    const gap = 12;
    const pad = 4;
    let body = '';
    for (let k = 0; k < n; k++) {
      const x0 = pad + k * (bw + gap);
      body += `<rect x="${x0}" y="${pad}" width="${bw}" height="${bh}" rx="8" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 4"/>`;
      body += `<text x="${x0 + bw / 2}" y="${pad + 16}" text-anchor="middle" class="dnl-small">Batch ${k + 1}</text>`;
      for (let i = 0; i < a; i++) body += shape(A, x0 + 6 + i * CELL + CELL / 2, pad + 22 + CELL / 2);
      for (let i = 0; i < b; i++) body += shape(B, x0 + 6 + i * CELL + CELL / 2, pad + 22 + CELL * 1.5);
    }
    const w = pad * 2 + n * bw + (n - 1) * gap;
    return svgWrap(w, bh + pad * 2, body, `${n} batch${n === 1 ? '' : 'es'}, each with ${a} ${A.name} and ${b} ${B.name}`, 'batches');
  }

  // Tape diagram with a value (or "?") in every box. rows: [{ label, n, item, text }]; total shown on the right.
  function tapeParts({ rows: list, total }) {
    const labelW = 96;
    const box = 42;
    const pad = 6;
    const cols = Math.max(...list.map((r) => r.n));
    let body = '';
    list.forEach((row, ri) => {
      const y = pad + ri * (box + 10);
      const item = resolve(row.item);
      body += `<text x="${pad}" y="${y + box / 2 + 5}" class="tape-label">${esc(row.label)}</text>`;
      for (let i = 0; i < row.n; i++) {
        const bx = pad + labelW + i * box;
        body += `<rect x="${bx}" y="${y}" width="${box}" height="${box}" fill="${item.color}" fill-opacity=".85" stroke="var(--ink)" stroke-width="1.5"/>`;
        body += `<text x="${bx + box / 2}" y="${y + box / 2 + 6}" text-anchor="middle" class="tape-box-text">${esc(row.text)}</text>`;
      }
    });
    const h = pad * 2 + list.length * box + (list.length - 1) * 10;
    const xEnd = pad + labelW + cols * box;
    if (total != null) {
      body += `<path d="M${xEnd + 8} ${pad} q8 0 8 8 V${h / 2 - 6} l6 6 l-6 6 V${h - pad - 8} q0 8 -8 8" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`;
      body += `<text x="${xEnd + 30}" y="${h / 2 + 5}" class="tape-label">${esc(total)}</text>`;
    }
    return svgWrap(xEnd + (total != null ? 110 : pad), h, body, `Tape diagram: ${list.map((r) => `${r.label} ${r.n} boxes`).join(', ')}${total != null ? `, ${total}` : ''}`, 'tape');
  }

  // HTML table of equivalent ratios. hidden: ['r,c'] cells show "?"; note: optional caption.
  function ratioTable({ heads, rows: list, hidden = [], note }) {
    return `
      <table class="ratio-table">
        ${note ? `<caption>${note}</caption>` : ''}
        <thead><tr>${heads.map((h) => `<th scope="col">${h}</th>`).join('')}</tr></thead>
        <tbody>${list.map((row, ri) => `<tr>${row.map((v, ci) => `<td>${hidden.includes(`${ri},${ci}`) ? '<span class="blank">?</span>' : v}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
  }

  // Small inline legend chip, e.g. [● red circles]
  function chip(itemKey) {
    const item = resolve(itemKey);
    const icon = svgWrap(2 * R + 4, 2 * R + 4, shape(item, R + 2, R + 2), '', 'chip-icon');
    return `<span class="chip">${icon}<span>${item.name}</span></span>`;
  }

  return { ITEMS, ITEM_KEYS, render, chip, resolve, doubleNumberLine, batches, tapeParts, ratioTable };
})();

  <script>
// Question generators for the practice engine.
//
// Every generator returns a question object:
//   { type, skill, lesson, prompt, visual?, format: 'mc' | 'ratio',
//     options? [{ id, html, correct, hint? }], check(input) -> { status, message? },
//     hint, explanation, solution, summary }
// `check` returns status 'correct' | 'incorrect' | 'invalid' (invalid = unreadable input, not an attempt).
const Questions = (() => {
  const { randInt, pick, shuffle, pickTwo, twoCounts, parseRatio } = Util;
  const { ITEMS, ITEM_KEYS } = Diagrams;

  const SKILLS = {
    objects:  'Identify a ratio from a group of objects',
    word:     'Write a ratio from a word description',
    read:     'Read and write ratio notation',
    reverse:  'Reverse a ratio',
    diagram:  'Identify a ratio from a diagram',
    choose:   'Choose the diagram that represents a ratio',
  };

  // Word-problem contexts: [first thing, second thing, sentence template].
  const CONTEXTS = [
    ['cats', 'dogs', (a, b) => `At the animal shelter there are ${a} cats and ${b} dogs.`],
    ['apples', 'oranges', (a, b) => `A fruit bowl holds ${a} apples and ${b} oranges.`],
    ['boys', 'girls', (a, b) => `A soccer team has ${a} boys and ${b} girls.`],
    ['pencils', 'erasers', (a, b) => `Maya's pencil case has ${a} pencils and ${b} erasers.`],
    ['muffins', 'bagels', (a, b) => `A bakery tray has ${a} muffins and ${b} bagels.`],
    ['goldfish', 'turtles', (a, b) => `A pet store tank has ${a} goldfish and ${b} turtles.`],
    ['red cars', 'blue cars', (a, b) => `A parking lot has ${a} red cars and ${b} blue cars.`],
    ['cups of flour', 'cups of sugar', (a, b) => `A recipe uses ${a} cups of flour and ${b} cups of sugar.`],
    ['novels', 'comic books', (a, b) => `A shelf holds ${a} novels and ${b} comic books.`],
    ['sunny days', 'rainy days', (a, b) => `Last month had ${a} sunny days and ${b} rainy days.`],
  ];

  const r = (x, y) => `${x} : ${y}`;
  const strong = (s) => `<strong>${s}</strong>`;
  const count = (n, item) => `${n} ${n === 1 ? item.single : item.name}`;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // Shared checker for typed ratio answers. Accepts equivalent ratios (e.g. 2:3 for 4:6).
  function ratioChecker(x, y, firstName, secondName) {
    return (input) => {
      const parsed = parseRatio(input);
      if (!parsed) {
        return { status: 'invalid', message: 'Type your answer as two numbers, like <strong>3:2</strong> or <strong>3 to 2</strong>.' };
      }
      const [p, q] = parsed;
      if (p === x && q === y) return { status: 'correct' };
      if (p * y === q * x && p > 0 && q > 0) {
        return { status: 'correct', message: `${r(p, q)} is equivalent to ${r(x, y)}, so that works too!` };
      }
      if (p === y && q === x) {
        return { status: 'incorrect', message: `Careful with the order! The question asks for ${firstName} <em>first</em>, then ${secondName}.` };
      }
      return { status: 'incorrect' };
    };
  }

  function mcChecker(options) {
    return (id) => {
      const opt = options.find((o) => o.id === id);
      if (!opt) return { status: 'invalid', message: 'Choose one of the answers.' };
      return opt.correct ? { status: 'correct' } : { status: 'incorrect', message: opt.hint };
    };
  }

  // Shuffles options and assigns ids A, B, C, D; drops duplicate values.
  function finalizeOptions(opts) {
    const seen = new Set();
    const unique = opts.filter((o) => {
      const key = o.key ?? o.html;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    return shuffle(unique).map((o, i) => ({ ...o, id: 'ABCD'[i] }));
  }

  // 1. Identify the ratio from a group of objects (typed answer).
  function objects(lesson) {
    const [ka, kb] = pickTwo(ITEM_KEYS);
    const [a, b] = twoCounts(1, 7);
    const order = shuffle([...Array(a).fill('a'), ...Array(b).fill('b')]);
    // Randomly ask for either order so students must read the question.
    const flip = Math.random() < 0.5;
    const [fx, fy, fItem, sItem] = flip ? [b, a, ITEMS[kb], ITEMS[ka]] : [a, b, ITEMS[ka], ITEMS[kb]];
    return {
      type: 'objects', skill: SKILLS.objects, lesson,
      prompt: `Write the ratio of ${strong(fItem.name)} to ${strong(sItem.name)}.`,
      summary: `Ratio of ${fItem.name} to ${sItem.name} (${count(a, ITEMS[ka])}, ${count(b, ITEMS[kb])})`,
      visual: { a, b, itemA: ka, itemB: kb, layout: 'mixed', order },
      format: 'ratio',
      check: ratioChecker(fx, fy, fItem.name, sItem.name),
      hint: `Count the ${fItem.name} first. Then count the ${sItem.name}. Write the numbers in that order.`,
      explanation: `There are ${fx} ${fItem.name} and ${fy} ${sItem.name}, so the ratio of ${fItem.name} to ${sItem.name} is ${strong(r(fx, fy))}.`,
      solution: r(fx, fy),
    };
  }

  // 2. Write a ratio from a word description (typed answer).
  function word(lesson) {
    const [nameA, nameB, sentence] = pick(CONTEXTS);
    const [a, b] = twoCounts(2, 9);
    const flip = Math.random() < 0.5;
    const [fx, fy, fName, sName] = flip ? [b, a, nameB, nameA] : [a, b, nameA, nameB];
    return {
      type: 'word', skill: SKILLS.word, lesson,
      prompt: `${sentence(a, b)}<br>Write the ratio of ${strong(fName)} to ${strong(sName)}.`,
      summary: `${sentence(a, b)} Ratio of ${fName} to ${sName}.`,
      format: 'ratio',
      check: ratioChecker(fx, fy, fName, sName),
      hint: `Find the number of ${fName} and the number of ${sName} in the sentence. The ${fName} come first.`,
      explanation: `The question names ${fName} first, so their number (${fx}) goes first: ${strong(r(fx, fy))}.`,
      solution: r(fx, fy),
    };
  }

  // 3. Read a ratio (multiple choice, three variants).
  function read(lesson) {
    const [a, b] = twoCounts(2, 9);
    const variant = randInt(0, 2);

    if (variant === 0) {
      const options = finalizeOptions([
        { html: `${a} to ${b}`, correct: true },
        { html: `${b} to ${a}`, hint: 'Read the numbers in the same order they are written, left to right.' },
        { html: `${a} out of ${b}`, hint: '"Out of" describes a part of a whole. A ratio compares two quantities: we say "to".' },
        { html: `${a} out of ${a + b}`, hint: 'A ratio compares the two numbers directly. It does not add them into a total.' },
      ]);
      return {
        type: 'read', skill: SKILLS.read, lesson,
        prompt: `How do you read the ratio ${strong(r(a, b))}?`,
        summary: `How do you read ${r(a, b)}?`,
        format: 'mc', options, check: mcChecker(options),
        hint: 'The colon ( : ) is read as the word "to".',
        explanation: `The colon is read as "to", so ${r(a, b)} is read as ${strong(`${a} to ${b}`)}.`,
        solution: `${a} to ${b}`,
      };
    }

    const [nameA, nameB] = pick(CONTEXTS);
    if (variant === 1) {
      const options = finalizeOptions([
        { html: r(a, b), correct: true },
        { html: r(b, a), hint: `Order matters: ${nameA} are mentioned first, so their number comes first.` },
        { html: r(a, a + b), hint: `That compares ${nameA} to the total. The question compares ${nameA} to ${nameB}.` },
        { html: r(a + b, b), hint: `That compares the total to ${nameB}. Use the two given numbers.` },
      ]);
      return {
        type: 'read', skill: SKILLS.read, lesson,
        prompt: `"For every ${a} ${nameA}, there are ${b} ${nameB}."<br>Which ratio compares ${strong(nameA)} to ${strong(nameB)}?`,
        summary: `For every ${a} ${nameA} there are ${b} ${nameB}: ratio of ${nameA} to ${nameB}.`,
        format: 'mc', options, check: mcChecker(options),
        hint: '"For every A, there are B" means the ratio A : B.',
        explanation: `"For every ${a} ${nameA}, there are ${b} ${nameB}" is the ratio ${strong(r(a, b))}.`,
        solution: r(a, b),
      };
    }

    // variant 2: which is NOT a way to write a to b
    const options = finalizeOptions([
      { html: r(b, a), correct: true },
      { html: r(a, b), hint: `${r(a, b)} <em>is</em> a correct way to write ${a} to ${b}. Look for the one that isn't.` },
      { html: `${a}/${b}`, hint: `${a}/${b} <em>is</em> a correct way to write ${a} to ${b}. Look for the one that isn't.` },
      { html: `${a} to ${b}`, hint: 'That is the ratio written in words, so it is correct. Look for the one that isn\'t.' },
    ]);
    return {
      type: 'read', skill: SKILLS.read, lesson,
      prompt: `Which of these is ${strong('NOT')} a way to write the ratio ${strong(`${a} to ${b}`)}?`,
      summary: `Which is NOT a way to write ${a} to ${b}?`,
      format: 'mc', options, check: mcChecker(options),
      hint: `A ratio can be written three ways: ${a} to ${b}, ${a} : ${b}, and ${a}/${b}. Check the order of the numbers in each.`,
      explanation: `${strong(r(b, a))} has the numbers in the wrong order, so it means ${b} to ${a}, a different ratio.`,
      solution: r(b, a),
    };
  }

  // 4. Reverse a ratio (typed answer).
  function reverse(lesson) {
    const [nameA, nameB] = pick(CONTEXTS);
    const [a, b] = twoCounts(2, 9);
    return {
      type: 'reverse', skill: SKILLS.reverse, lesson,
      prompt: `The ratio of ${nameA} to ${nameB} is ${strong(r(a, b))}.<br>What is the ratio of ${strong(nameB)} to ${strong(nameA)}?`,
      summary: `${cap(nameA)} to ${nameB} is ${r(a, b)}. What is ${nameB} to ${nameA}?`,
      format: 'ratio',
      check: (input) => {
        const res = ratioChecker(b, a, nameB, nameA)(input);
        // Equivalent-ratio acceptance is fine, but repeating the original ratio is the key mistake here.
        if (res.status === 'incorrect' && parseRatio(input)?.join() === `${a},${b}`) {
          return { status: 'incorrect', message: `That's the original ratio. Now ${nameB} come first, so the numbers swap places.` };
        }
        return res;
      },
      hint: `There are ${a} ${nameA} for every ${b} ${nameB}. Now put the ${nameB} first.`,
      explanation: `Reversing a ratio swaps the order of the numbers: ${nameA} to ${nameB} is ${r(a, b)}, so ${nameB} to ${nameA} is ${strong(r(b, a))}.`,
      solution: r(b, a),
    };
  }

  // 5. Identify a ratio from a diagram (multiple choice).
  function diagram(lesson) {
    const [ka, kb] = pickTwo(ITEM_KEYS);
    const [a, b] = twoCounts(1, 8);
    const A = ITEMS[ka], B = ITEMS[kb];
    const options = finalizeOptions([
      { html: r(a, b), correct: true },
      { html: r(b, a), hint: `Order matters. The question asks for ${A.name} first.` },
      { html: r(a, a + b), hint: `That compares ${A.name} to <em>all</em> the shapes. Compare ${A.name} to ${B.name} only.` },
      { html: r(a + 1, b), hint: `Count the ${A.name} again carefully. Try touching each one as you count.` },
    ]);
    return {
      type: 'diagram', skill: SKILLS.diagram, lesson,
      prompt: `What is the ratio of ${strong(A.name)} to ${strong(B.name)} in this diagram?`,
      summary: `Diagram: ratio of ${A.name} to ${B.name} (${count(a, A)}, ${count(b, B)})`,
      visual: { a, b, itemA: ka, itemB: kb, layout: 'grouped' },
      format: 'mc', options, check: mcChecker(options),
      hint: `Count each group separately. How many ${A.name}? How many ${B.name}?`,
      explanation: `The diagram shows ${a} ${A.name} and ${b} ${B.name}, so the ratio is ${strong(r(a, b))}.`,
      solution: r(a, b),
    };
  }

  // 6. Choose the diagram that represents a ratio (multiple choice with diagram options).
  function choose(lesson) {
    const [ka, kb] = pickTwo(ITEM_KEYS);
    const [a, b] = twoCounts(1, 6);
    const A = ITEMS[ka], B = ITEMS[kb];
    const mk = (x, y, extra) => ({
      key: `${x}:${y}`,
      html: Diagrams.render({ a: x, b: y, itemA: ka, itemB: kb, layout: 'grouped' }),
      ...extra,
    });
    const options = finalizeOptions([
      mk(a, b, { correct: true }),
      mk(b, a, { hint: `That diagram has ${b} ${A.name} and ${a} ${B.name}. The numbers are reversed.` }),
      mk(a, b + 1, { hint: `Count the ${B.name} in that diagram. There should be exactly ${b}.` }),
      mk(a + 1, b, { hint: `Count the ${A.name} in that diagram. There should be exactly ${a}.` }),
    ]);
    return {
      type: 'choose', skill: SKILLS.choose, lesson,
      prompt: `Which diagram shows a ratio of ${strong(A.name)} to ${strong(B.name)} of ${strong(r(a, b))}?`,
      summary: `Choose the diagram for ${A.name} to ${B.name} = ${r(a, b)}`,
      format: 'mc', options, check: mcChecker(options), wideOptions: true,
      hint: `Look for a diagram with exactly ${a} ${A.name} and exactly ${b} ${B.name}.`,
      explanation: `The ratio ${r(a, b)} means ${a} ${A.name} for every ${b} ${B.name}. The correct diagram shows exactly that.`,
      solution: `the diagram with ${a} ${A.name} and ${b} ${B.name}`,
      solutionVisual: { a, b, itemA: ka, itemB: kb, layout: 'grouped' },
    };
  }

  const GENERATORS = { objects, word, read, reverse, diagram, choose };

  const LESSON_TYPES = {
    1: ['objects', 'word', 'read', 'reverse'],
    2: ['objects', 'diagram', 'choose'],
  };

  // Builds a session that covers every question type in the lesson before repeating any.
  function buildSession(lesson, count = 5) {
    const types = LESSON_TYPES[lesson];
    const seq = [];
    while (seq.length < count) seq.push(...shuffle(types));
    const seen = new Set();
    return seq.slice(0, count).map((type) => {
      let q;
      let tries = 0;
      do {
        q = GENERATORS[type](lesson);
        tries++;
      } while (seen.has(q.summary) && tries < 20);
      seen.add(q.summary);
      return q;
    });
  }

  return { SKILLS, GENERATORS, LESSON_TYPES, buildSession };
})();

  <script>
// Interactive lesson content. Each step has static `html` plus an optional `mount(el)` that wires up interactivity.
const Lessons = (() => {
  const D = Diagrams;
  const r = (x, y) => `${x} : ${y}`;

  // Inline check with instant feedback. options: [{ label, correct, feedback }]
  function miniCheck(el, selector, options) {
    const host = el.querySelector(selector);
    host.innerHTML = `
      <div class="mini-options">${options.map((o, i) => `<button type="button" class="btn btn-option" data-i="${i}">${o.label}</button>`).join('')}</div>
      <p class="mini-feedback" role="status"></p>`;
    const fb = host.querySelector('.mini-feedback');
    host.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const o = options[+btn.dataset.i];
        host.querySelectorAll('button').forEach((b) => b.classList.remove('is-correct', 'is-wrong'));
        btn.classList.add(o.correct ? 'is-correct' : 'is-wrong');
        fb.className = `mini-feedback ${o.correct ? 'good' : 'bad'}`;
        fb.innerHTML = `${o.correct ? '✅ ' : '🤔 '}${o.feedback}`;
      });
    });
  }

  // A +/- stepper; calls onChange(value) and returns a setter.
  function stepper(el, selector, { value, min = 0, max = 10, label, onChange }) {
    const host = el.querySelector(selector);
    host.innerHTML = `
      <span class="stepper-label">${label}</span>
      <button type="button" class="btn btn-round" data-d="-1" aria-label="Remove one ${label}">−</button>
      <output class="stepper-value">${value}</output>
      <button type="button" class="btn btn-round" data-d="1" aria-label="Add one ${label}">+</button>`;
    const out = host.querySelector('output');
    host.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = Math.min(max, Math.max(min, value + +btn.dataset.d));
        if (next === value) return;
        value = next;
        out.textContent = value;
        onChange(value);
      });
    });
  }

  const lesson1 = {
    id: 1,
    short: 'Lesson 1',
    title: 'Lesson 1: What Is a Ratio?',
    blurb: 'Compare two quantities, write ratios three ways, and learn why order matters.',
    art: D.render({ a: 3, b: 2, itemA: 'red', itemB: 'blue' }),
    steps: [
      {
        title: 'What is a ratio?',
        html: `
          <p>A <strong>ratio</strong> compares two quantities.</p>
          <div class="diagram-box">${D.render({ a: 3, b: 2, itemA: 'red', itemB: 'blue' })}</div>

            <p class="big-ratio">3 : 2</p>

        mount(el) {
          el.querySelector('#reveal').addEventListener('click', (e) => {

          });
        },
      },
      {
        title: 'What two quantities are being compared?',
        html: `
          <p>Every ratio compares <strong>two</strong> things. Before you write a ratio, ask: <em>what am I comparing?</em></p>
          <div class="callout">A zoo has <strong>4 penguins</strong> and <strong>6 seals</strong>.<br>Find the ratio of penguins to seals.</div>

        mount(el) {

  const lesson2 = {
    id: 2,
    short: 'Lesson 2',

    steps: [
      {

        mount(el) {

            el.querySelector('#repDiagram').innerHTML = D.render({ a, b, itemA: ka, itemB: kb });
          };
          el.querySelector('#another').addEventListener('click', draw);
          draw();
        },
      },
      {
        title: 'Reading ratios from diagrams',
        html: `
          <p>To read a ratio from a diagram, count one kind of object at a time. <strong>Tap each shape</strong> to count it.</p>
          <div class="diagram-box countable" id="countDiagram">${D.render({ a: 4, b: 5, itemA: 'purple', itemB: 'green', layout: 'mixed', countable: true, order: ['a', 'b', 'b', 'a', 'b', 'a', 'b', 'b', 'a'] })}</div>

            let msg;

            else if (a === 3 && b === 4) msg = ['bad', '🤔 You have 3 red and 4 blue. That is reversed! Red comes first in 4 : 3.'];
            else msg = ['bad', `🤔 You have ${a} red and ${b} blue (${r(a, b)}). The first number tells you how many red; the second tells you how many blue.`];
            fb.className = `mini-feedback ${msg[0]}`;
            fb.textContent = msg[1];

      {
        title: 'The ratio and its diagram',
        html: `
          <p>A diagram can be arranged in different ways. Tap each style.</p>
          <div class="notation-tabs">
            <button type="button" class="btn btn-option is-selected" data-l="grouped">Groups</button>
            <button type="button" class="btn btn-option" data-l="mixed">Mixed</button>
            <button type="button" class="btn btn-option" data-l="rows">Rows</button>
            <button type="button" class="btn btn-option" data-l="tape">Tape</button>
          </div>
          <div class="diagram-box" id="layoutDiagram"></div>
          <div class="callout">In every style there are <strong>3</strong> orange stars and <strong>4</strong> blue squares. The ratio is always <span class="big-ratio inline">3 : 4</span></div>
          <p class="muted">Moving the objects around doesn't change the ratio. Only changing <em>how many</em> of each kind does.</p>`,
        mount(el) {
          const order = ['b', 'a', 'b', 'b', 'a', 'b', 'a'];
          const draw = (layout) => {
            el.querySelector('#layoutDiagram').innerHTML = D.render({ a: 3, b: 4, itemA: 'orange', itemB: 'blue', layout, order });
          };
          el.querySelectorAll('[data-l]').forEach((btn) => btn.addEventListener('click', () => {
            el.querySelectorAll('[data-l]').forEach((b) => b.classList.toggle('is-selected', b === btn));
            draw(btn.dataset.l);
          }));
          draw('grouped');
        },
      },
      {
        title: 'Quick check',
        html: `
          <div class="diagram-box">${D.render({ a: 5, b: 2, itemA: 'purple', itemB: 'green' })}</div>
          <p>What is the ratio of <strong>purple diamonds to green triangles</strong>?</p>
          <div id="check"></div>`,
        mount(el) {
          miniCheck(el, '#check', [
            { label: '2 : 5', correct: false, feedback: 'That is green to purple. Purple comes first here.' },
            { label: '5 : 7', correct: false, feedback: '7 is the total number of shapes. Compare purple to green only.' },
            { label: '5 : 2', correct: true, feedback: 'Correct! 5 purple diamonds for every 2 green triangles: <strong>5 : 2</strong>.' },
          ]);
        },
      },
    ],
  };

  return { all: [lesson1, lesson2], byId: { 1: lesson1, 2: lesson2 }, miniCheck, stepper };
})();
